<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas Entregas — GuiaZap</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css">
<style>
  .entregas-header { background: #1c1c1c; padding: 24px 15px; text-align: center; color: white; }
  .entregas-header h1 { font-size: 1.6rem; font-weight: 800; }
  .entregas-wrap { max-width: 500px; margin: 0 auto; padding: 15px 15px 40px; }
  .voltar { display: block; margin-bottom: 14px; color: var(--verde-escuro); font-weight: 600; text-decoration: none; font-size: 0.85rem; }
  .abas-entregas { display: flex; gap: 6px; margin-bottom: 14px; }
  .abas-entregas button {
    flex: 1; padding: 9px; border-radius: 50px; border: 1px solid #ddd; background: white;
    font-size: 0.8rem; font-weight: 700; cursor: pointer; color: #666;
  }
  .abas-entregas button.ativa { background: #1c1c1c; color: white; border-color: #1c1c1c; }
  .card-entrega {
    background: var(--cinza-card); border-radius: 12px; padding: 14px; margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  }
  .card-entrega .empresa-entrega { font-weight: 800; font-size: 0.9rem; color: var(--verde-escuro); }
  .card-entrega .endereco-entrega { font-size: 0.88rem; margin-top: 6px; line-height: 1.4; }
  .card-entrega .itens-entrega { font-size: 0.8rem; color: #666; margin-top: 6px; line-height: 1.4; }
  .card-entrega .total-entrega { font-size: 0.85rem; font-weight: 700; margin-top: 6px; }
  .btn-aceitar-entrega { width: 100%; margin-top: 10px; padding: 10px; border-radius: 8px; border: none; background: var(--verde-whats); color: white; font-weight: 700; cursor: pointer; }
  .btn-concluir-entrega { width: 100%; margin-top: 10px; padding: 10px; border-radius: 8px; border: none; background: #0f766e; color: white; font-weight: 700; cursor: pointer; }
  .vazio-entregas { text-align: center; padding: 50px 20px; color: #999; font-size: 0.85rem; }
</style>
</head>
<body>
<header class="entregas-header">
  <h1>🛵 Minhas Entregas</h1>
</header>

<div class="entregas-wrap">
  <a href="index.html" class="voltar">← Voltar ao GuiaZap</a>

  <div id="chave-pix-motoboy" style="display:none; background:var(--cinza-card); border-radius:10px; padding:12px; margin-bottom:12px; font-size:0.85rem;">
    <label style="font-weight:700; display:block; margin-bottom:6px;">💳 Sua chave Pix (pra receber os repasses)</label>
    <div style="display:flex; gap:6px;">
      <input type="text" id="input-chave-pix" placeholder="CPF, e-mail, telefone ou chave aleatória" style="flex:1; padding:8px; border:1px solid #ddd; border-radius:6px; font-size:0.85rem;">
      <button type="button" onclick="salvarChavePix()" style="padding:8px 14px; border-radius:6px; border:none; background:#0f766e; color:white; font-weight:700; cursor:pointer;">Salvar</button>
    </div>
    <span id="chave-pix-msg" style="font-size:0.75rem; color:var(--verde-escuro);"></span>
  </div>

  <div class="abas-entregas">
    <button type="button" class="ativa" data-aba="disponiveis" onclick="mudarAbaEntregas('disponiveis', this)">📦 Disponíveis</button>
    <button type="button" data-aba="minhas" onclick="mudarAbaEntregas('minhas', this)">🛵 Minhas corridas</button>
    <button type="button" data-aba="repasses" onclick="mudarAbaEntregas('repasses', this)">💰 A receber</button>
  </div>

  <div id="lista-entregas">Carregando...</div>
</div>

<script src="js/modo-escuro.js"></script>
<script src="config.js"></script>
<script>
const supabaseClientEntregas = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUserEntregas = null;
let entregasDisponiveis = [];
let minhasEntregas = [];
let meusRepasses = [];
let abaEntregasAtual = 'disponiveis';

function escapeHtmlEntregas(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

async function initEntregas(){
  const { data: { session } } = await supabaseClientEntregas.auth.getSession();
  if(!session){
    document.getElementById('lista-entregas').innerHTML = '<div class="vazio-entregas">🔒 Faça login na <a href="index.html">página inicial</a> pra ver suas entregas.</div>';
    return;
  }
  currentUserEntregas = session.user;

  const { data: cadastros } = await supabaseClientEntregas.from('motoboys').select('id, chave_pix').eq('user_id', currentUserEntregas.id).eq('ativo', true);
  if(!cadastros || cadastros.length === 0){
    document.getElementById('lista-entregas').innerHTML = '<div class="vazio-entregas">Você ainda não está cadastrado como motoboy de nenhuma empresa. Peça pro dono da empresa te adicionar (usando seu código GuiaZap).</div>';
    return;
  }

  document.getElementById('chave-pix-motoboy').style.display = 'block';
  document.getElementById('input-chave-pix').value = cadastros[0].chave_pix || '';

  await carregarEntregas();

  // Atualiza sozinho quando aparecer entrega nova ou alguém aceitar uma
  supabaseClientEntregas
    .channel('entregas-realtime')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, () => { carregarEntregas(); })
    .subscribe();
}

async function salvarChavePix(){
  const chave = document.getElementById('input-chave-pix').value.trim();
  const msg = document.getElementById('chave-pix-msg');
  if(!chave){ msg.textContent = 'Digite uma chave Pix.'; return; }

  const { error } = await supabaseClientEntregas.from('motoboys').update({ chave_pix: chave }).eq('user_id', currentUserEntregas.id);
  msg.textContent = error ? 'Erro ao salvar.' : '✓ Chave Pix salva!';
}

async function carregarEntregas(){
  const { data: disponiveis } = await supabaseClientEntregas
    .from('pedidos')
    .select('*, profissionais(name)')
    .eq('status', 'pronto')
    .is('motoboy_user_id', null)
    .gt('taxa_entrega', 0)
    .order('created_at', { ascending: true });
  entregasDisponiveis = disponiveis || [];

  const { data: minhas } = await supabaseClientEntregas
    .from('pedidos')
    .select('*, profissionais(name)')
    .eq('motoboy_user_id', currentUserEntregas.id)
    .in('status', ['pronto', 'saiu_entrega'])
    .order('created_at', { ascending: true });
  minhasEntregas = minhas || [];

  const { data: repasses } = await supabaseClientEntregas
    .from('repasses_motoboy')
    .select('*, profissionais(name)')
    .eq('motoboy_user_id', currentUserEntregas.id)
    .order('created_at', { ascending: false });
  meusRepasses = repasses || [];

  renderEntregas();
}

function mudarAbaEntregas(aba, btn){
  abaEntregasAtual = aba;
  document.querySelectorAll('.abas-entregas button').forEach(b => b.classList.remove('ativa'));
  btn.classList.add('ativa');
  renderEntregas();
}

function renderEntregas(){
  const container = document.getElementById('lista-entregas');

  if(abaEntregasAtual === 'repasses'){
    renderMeusRepasses(container);
    return;
  }

  const lista = abaEntregasAtual === 'disponiveis' ? entregasDisponiveis : minhasEntregas;

  if(lista.length === 0){
    container.innerHTML = abaEntregasAtual === 'disponiveis'
      ? '<div class="vazio-entregas">Nenhuma entrega disponível no momento.</div>'
      : '<div class="vazio-entregas">Você não tem nenhuma corrida em andamento.</div>';
    return;
  }

  container.innerHTML = lista.map(p => {
    const itens = (p.itens || []).map(i => `${escapeHtmlEntregas(i.nome)}`).join(', ');
    const nomeEmpresa = p.profissionais ? p.profissionais.name : 'Empresa';

    const acao = abaEntregasAtual === 'disponiveis'
      ? `<button type="button" class="btn-aceitar-entrega" onclick="aceitarEntrega('${p.id}')">✅ Aceitar essa entrega</button>`
      : p.status === 'pronto'
        ? `<button type="button" class="btn-concluir-entrega" onclick="marcarSaiuParaEntrega('${p.id}')">🛵 Saí para entregar</button>`
        : `<button type="button" class="btn-concluir-entrega" onclick="concluirEntrega('${p.id}')">✅ Confirmar entrega feita</button>`;

    return `
      <div class="card-entrega">
        <div class="empresa-entrega">🏪 ${escapeHtmlEntregas(nomeEmpresa)}</div>
        <div class="endereco-entrega">📍 ${escapeHtmlEntregas(p.endereco_entrega || 'Endereço não informado')}</div>
        ${p.latitude_entrega != null && p.longitude_entrega != null
          ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${p.latitude_entrega},${p.longitude_entrega}" target="_blank" style="display:inline-block; margin-top:6px; font-size:0.82rem; font-weight:700; color:#1565c0; text-decoration:none;">🗺️ Como chegar (localização exata)</a>`
          : p.endereco_entrega
            ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.endereco_entrega)}" target="_blank" style="display:inline-block; margin-top:6px; font-size:0.82rem; font-weight:700; color:#1565c0; text-decoration:none;">🗺️ Como chegar</a>`
            : ''}
        <div class="itens-entrega">${itens}</div>
        <div class="total-entrega">🛵 Taxa de entrega: R$ ${Number(p.taxa_entrega).toFixed(2).replace('.', ',')}</div>
        ${acao}
      </div>
    `;
  }).join('');
}

function renderMeusRepasses(container){
  if(meusRepasses.length === 0){
    container.innerHTML = '<div class="vazio-entregas">Nenhum repasse registrado ainda. Aparece aqui depois que você concluir uma entrega.</div>';
    return;
  }

  const totalPendente = meusRepasses.filter(r => r.status === 'pendente').reduce((soma, r) => soma + Number(r.valor), 0);

  container.innerHTML = `
    <div style="background:#fff3cd; color:#7c4a03; padding:12px; border-radius:10px; margin-bottom:12px; text-align:center; font-weight:800;">
      💰 Total pendente: R$ ${totalPendente.toFixed(2).replace('.', ',')}
    </div>
    ${meusRepasses.map(r => `
      <div class="card-entrega">
        <div class="empresa-entrega">🏪 ${escapeHtmlEntregas(r.profissionais ? r.profissionais.name : 'Empresa')}</div>
        <div class="total-entrega">R$ ${Number(r.valor).toFixed(2).replace('.', ',')}</div>
        <div style="font-size:0.78rem; color:#888; margin-top:4px;">${new Date(r.created_at).toLocaleDateString('pt-BR')}</div>
        <span style="display:inline-block; margin-top:6px; padding:3px 10px; border-radius:50px; font-size:0.75rem; font-weight:700; background:${r.status === 'pago' ? '#e8f5e9' : '#fff3cd'}; color:${r.status === 'pago' ? '#1a7a3c' : '#7c4a03'};">
          ${r.status === 'pago' ? '✅ Pago' : '⏳ Aguardando pagamento da empresa'}
        </span>
      </div>
    `).join('')}
  `;
}

async function aceitarEntrega(pedidoId){
  // Usa .is('motoboy_user_id', null) na condição — se outro motoboy já
  // aceitou entre o carregamento da lista e o clique, essa atualização não
  // vai encontrar nenhuma linha (protege contra dois motoboys pegando a mesma corrida)
  const { data, error } = await supabaseClientEntregas
    .from('pedidos')
    .update({ motoboy_user_id: currentUserEntregas.id })
    .eq('id', pedidoId)
    .is('motoboy_user_id', null)
    .select();

  if(error || !data || data.length === 0){
    alert('Ops! Essa entrega já foi aceita por outro motoboy.');
    await carregarEntregas();
    return;
  }

  alert('🛵 Entrega aceita! Vai aparecer em "Minhas corridas".');
  mudarAbaEntregas('minhas', document.querySelector('[data-aba="minhas"]'));
}

async function marcarSaiuParaEntrega(pedidoId){
  const { error } = await supabaseClientEntregas.from('pedidos').update({ status: 'saiu_entrega' }).eq('id', pedidoId).eq('motoboy_user_id', currentUserEntregas.id);
  if(error){ alert('Erro ao atualizar. Tente de novo.'); return; }
  await carregarEntregas();
}

async function concluirEntrega(pedidoId){
  const pedido = minhasEntregas.find(p => p.id === pedidoId);
  if(!pedido) return;

  const digitado = prompt('Peça pro cliente informar o código de confirmação dele, e digite aqui:');
  if(digitado === null) return;
  if(digitado.trim() !== pedido.codigo_confirmacao){
    alert('❌ Código incorreto! Confira com o cliente antes de confirmar.');
    return;
  }

  const { error } = await supabaseClientEntregas.from('pedidos').update({ status: 'concluido' }).eq('id', pedidoId).eq('motoboy_user_id', currentUserEntregas.id);
  if(error){ alert('Erro ao concluir. Tente de novo.'); return; }

  // Gera o registro de "valor a receber" — a política de segurança do banco
  // só deixa isso acontecer se o pedido realmente foi concluído por você e
  // o valor bate certinho com a taxa de entrega
  const { error: erroRepasse } = await supabaseClientEntregas.from('repasses_motoboy').insert({
    motoboy_user_id: currentUserEntregas.id,
    pedido_id: pedidoId,
    profissional_id: pedido.profissional_id,
    valor: pedido.taxa_entrega,
    status: 'pendente'
  });
  if(erroRepasse) console.error('erro ao gerar repasse', erroRepasse);

  alert('🎉 Entrega concluída! O valor de R$ ' + Number(pedido.taxa_entrega).toFixed(2).replace('.', ',') + ' foi registrado como "a receber".');
  await carregarEntregas();
}

initEntregas();
</script>
</body>
</html>
