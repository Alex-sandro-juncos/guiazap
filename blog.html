<body>
<button type="button" onclick="toggleModoVozBlog()" aria-label="Ativar modo de voz do GuiaZap Blog, para escrever um artigo sem precisar ver ou tocar na tela, feito pra quem não enxerga" style="position:absolute; top:0; left:0; width:100%; height:64px; margin:0; padding:0; border:none; background:transparent; color:transparent; cursor:pointer; font-size:0.01px; line-height:1; z-index:10;">
  Ativar modo de voz do GuiaZap Blog, para escrever um artigo sem precisar ver ou tocar na tela, feito pra quem não enxerga
</button>
<header><div class="logo">GuiaZap</div><p>Blog — Dicas locais</p></header>
<button type="button" class="btn-modo-escuro-solto" onclick="toggleModoEscuro()" id="btn-modo-escuro" style="display:block; margin:10px auto 0;">🌙 Modo escuro</button>
<div class="blog-wrap">
  <a href="index.html" class="voltar">← Voltar ao GuiaZap</a>

  <div class="enviar-form">
    <h2>✍️ Escreva um artigo</h2>
    <p style="font-size:0.8rem; color:#666; margin-bottom:10px;">Tem uma dica boa sobre um serviço, um bairro ou um assunto local? Envie seu artigo — ele passa por uma revisão antes de ser publicado.</p>

    <button type="button" id="btn-modo-voz-blog" onclick="toggleModoVozBlog()" aria-hidden="true" tabindex="-1" style="display:none; background:#6b46c1; border:none; color:white; padding:10px 16px; border-radius:10px; font-size:0.85rem; font-weight:700; cursor:pointer; margin-bottom:12px; width:100%;">🎙️ Redigir artigo por voz</button>

    <div id="painel-modo-voz-blog" style="display:none; position:fixed; bottom:20px; left:16px; right:16px; max-width:420px; margin:0 auto; background:#1c1c2e; border-radius:16px; padding:16px; z-index:1600; box-shadow:0 4px 24px rgba(0,0,0,0.4);">
      <div style="display:flex; align-items:center; gap:10px;">
        <div id="voz-blog-indicador" style="width:14px; height:14px; border-radius:50%; background:#6b46c1; flex-shrink:0; transition:background 0.2s;"></div>
        <div style="flex:1; min-width:0;">
          <div style="color:white; font-weight:700; font-size:0.85rem;" id="voz-blog-status" aria-live="polite" role="status">🎙️ Modo voz ativado — pode falar</div>
          <div style="color:#aaa; font-size:0.75rem; margin-top:2px;" id="voz-blog-transcricao"></div>
        </div>
        <button type="button" onclick="toggleModoVozBlog()" style="background:#a4402f; border:none; color:white; width:32px; height:32px; border-radius:50%; font-size:0.9rem; cursor:pointer; flex-shrink:0;" aria-label="Fechar modo voz">✕</button>
      </div>
    </div>

    <div class="field">
      <label for="blog-autor">Seu nome</label>
      <input id="blog-autor" placeholder="Como quer aparecer">
    </div>
    <div class="field">
      <label for="blog-email">Seu e-mail (não aparece publicado)</label>
      <input id="blog-email" type="email" placeholder="seuemail@gmail.com">
    </div>
    <div class="field">
      <label for="blog-titulo">Título do artigo</label>
      <input id="blog-titulo" placeholder="Ex: Como escolher um eletricista de confiança">
    </div>
    <div class="field">
      <label for="blog-tema">Tema</label>
      <input id="blog-tema" list="blog-temas-sugeridos" placeholder="Ex: Dicas pra contratar, Empreendedorismo, Novidades...">
      <datalist id="blog-temas-sugeridos"></datalist>

  <h2 style="font-size:1.1rem; color:var(--verde-escuro); margin-bottom:12px;">Artigos publicados</h2>
  <input type="text" id="blog-busca" class="blog-busca-input" placeholder="🔍 Buscar por título ou autor..." oninput="renderArtigos()">
  <div id="blog-lista">Carregando...</div>

<script src="js/comandos-navegacao-voz.js"></script>
<script src="config.js"></script>
<script>
const supabaseClientBlog = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escapeHtmlBlog(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function gerarSlug(titulo){
  return titulo
    .toString()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9\s-]/g, '')
    .trim()
    .replace(/\s+/g, '-')
    .slice(0, 60);
}

async function enviarArtigo(){
  const autor = document.getElementById('blog-autor').value.trim();
  const email = document.getElementById('blog-email').value.trim();
  const titulo = document.getElementById('blog-titulo').value.trim();
  const tema = document.getElementById('blog-tema').value.trim();
  const conteudo = document.getElementById('blog-conteudo').value.trim();
  const msg = document.getElementById('blog-msg');

  if(!autor || !titulo || !conteudo){ msg.textContent = 'Preencha nome, título e conteúdo.'; msg.style.color = '#a4402f'; return; }
  if(conteudo.length < 200){ msg.textContent = 'O artigo precisa ter pelo menos 200 caracteres.'; msg.style.color = '#a4402f'; return; }

  msg.textContent = 'enviando...';
  const slugBase = gerarSlug(titulo);
  const slugFinal = `${slugBase}-${Date.now().toString().slice(-5)}`;

  const { data, error } = await supabaseClientBlog.from('blog_posts').insert({
    titulo, conteudo, autor_nome: autor, autor_email: email || null, tema: tema || null, slug: slugFinal
  }).select('id').single();

  if(error){ console.error(error); msg.textContent = 'Erro ao enviar. Tente de novo.'; msg.style.color = '#a4402f'; return; }

  document.getElementById('blog-autor').value = '';
  document.getElementById('blog-email').value = '';
  document.getElementById('blog-titulo').value = '';
  document.getElementById('blog-tema').value = '';
  document.getElementById('blog-conteudo').value = '';

  // Manda pra revisão automática por IA — aprova ou exclui sozinha, sem
  // precisar de ninguém lendo manualmente. Se der algum erro na revisão,
  // o artigo fica pendente (não aprovado, não excluído) pra ser visto
  // depois pelo admin.
  msg.textContent = 'revisando com IA...';
  try{
    const resp = await fetch('/.netlify/functions/revisar-blog-ia', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: data.id })
    });
    const resultado = await resp.json();

    if(resultado.decisao === 'aprovado'){
      msg.textContent = '✓ Artigo publicado! Já pode ver na lista abaixo.';
      msg.style.color = 'var(--verde-escuro)';
      loadArtigos();
    } else if(resultado.decisao === 'excluido'){
      msg.textContent = 'Seu artigo não passou na revisão automática. Motivo: ' + (resultado.motivo || 'não informado') + '. Você pode ajustar e enviar de novo.';
      msg.style.color = '#a4402f';
    } else {
      msg.textContent = 'Artigo enviado! Vai ser revisado em breve.';
      msg.style.color = 'var(--verde-escuro)';
    }
  } catch(e){
    console.error('erro ao chamar revisão por IA', e);
    msg.textContent = 'Artigo enviado! Vai ser revisado em breve.';
    msg.style.color = 'var(--verde-escuro)';
  }
}

let artigosCarregados = [];

function normalizarBuscaBlog(str){
  return (str || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

async function loadArtigos(){
  const container = document.getElementById('blog-lista');
  const { data, error } = await supabaseClientBlog.from('blog_posts').select('titulo, slug, autor_nome, tema, conteudo, created_at').eq('aprovado', true).order('created_at', { ascending: false });

  if(error || !data){
    container.innerHTML = '<p style="color:#999; font-size:0.85rem;">Ainda não temos artigos publicados. Seja o primeiro a escrever!</p>';
    return;
  }

  artigosCarregados = data;

  // Preenche as sugestões de tema no formulário de envio com os temas que
  // já foram usados antes — assim quem for escrever vê o que já existe em
  // vez de inventar um tema novo toda vez
  const temasUnicos = [...new Set(data.map(p => p.tema).filter(Boolean))];
  const datalist = document.getElementById('blog-temas-sugeridos');
  if(datalist) datalist.innerHTML = temasUnicos.map(t => `<option value="${escapeHtmlBlog(t)}"></option>`).join('');

  renderArtigos();
}

function renderArtigos(){
  const container = document.getElementById('blog-lista');
  const query = normalizarBuscaBlog(document.getElementById('blog-busca').value);

  const filtrados = artigosCarregados.filter(p =>
    normalizarBuscaBlog(p.titulo).includes(query) || normalizarBuscaBlog(p.autor_nome).includes(query) || normalizarBuscaBlog(p.tema).includes(query)
  );

  if(artigosCarregados.length === 0){
    container.innerHTML = '<p style="color:#999; font-size:0.85rem;">Ainda não temos artigos publicados. Seja o primeiro a escrever!</p>';
    return;
  }

  if(filtrados.length === 0){
    container.innerHTML = '<p style="color:#999; font-size:0.85rem;">Nenhum artigo encontrado pra essa busca.</p>';
    return;
  }

  container.innerHTML = filtrados.map(p => `
    <a href="/blog/${p.slug}" class="card-post">
      <div class="titulo-post">${escapeHtmlBlog(p.titulo)}</div>
      <div class="autor-post">Por ${escapeHtmlBlog(p.autor_nome)} · ${new Date(p.created_at).toLocaleDateString('pt-BR')}${p.tema ? ' · ' + escapeHtmlBlog(p.tema) : ''}</div>
      <div class="resumo-post">${escapeHtmlBlog(p.conteudo.slice(0, 140))}...</div>
    </a>
  `).join('');
}


loadArtigos();

// ---------- MODO VOZ: REDIGIR ARTIGO POR VOZ ----------
let _vozBlogReconhecimento = null;
let _vozBlogAtiva = false;
let _vozBlogFalando = false;
const _vozBlogSynth = window.speechSynthesis;
let _estadoRedacaoBlog = null; // { etapa: 'nome'|'email'|'titulo'|'conteudo'|'confirmar' }

function normalizarTextoBlog(str){
  return (str || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}

function toggleModoVozBlog(){
  if(_vozBlogAtiva) pararModoVozBlog();
  else iniciarModoVozBlog();
}

let _aguardandoAtivacaoBlog = false;
let _vozBlogUltimoSinalDeVida = 0;
let _vozBlogVigia = null;
let _vozBlogTentativasReconexao = 0;

function iniciarModoVozBlog(retomandoAutomaticamente){
  const SpeechRecognitionApi = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognitionApi){
    alert('Seu navegador não suporta reconhecimento de voz. Tenta pelo Chrome no celular ou computador.');
    return;
  }

  _vozBlogAtiva = true;
  if(typeof ativarModoVozPermanente === 'function') ativarModoVozPermanente();
  document.getElementById('btn-modo-voz-blog').style.background = '#a4402f';
  document.getElementById('btn-modo-voz-blog').setAttribute('aria-label', 'Desativar modo voz');
  document.getElementById('painel-modo-voz-blog').style.display = 'block';
  document.getElementById('voz-blog-transcricao').textContent = '';
  _aguardandoAtivacaoBlog = !!retomandoAutomaticamente;
  _vozBlogTentativasReconexao = 0;

  if(_aguardandoAtivacaoBlog){
    document.getElementById('voz-blog-status').textContent = '🎙️ Modo voz em espera';
  } else {
    _estadoRedacaoBlog = { etapa: 'escolher_ler_ou_escrever' };
    document.getElementById('voz-blog-status').textContent = '🎙️ Modo voz ativado — pode falar';
  }

  _criarReconhecimentoBlog(SpeechRecognitionApi);
  _iniciarVigiaVozBlog(SpeechRecognitionApi);
  if(typeof iniciarBiometriaSeConfigurada === 'function') iniciarBiometriaSeConfigurada();
  if(_aguardandoAtivacaoBlog){
    falarVozBlog('Modo voz em espera. Fala "ativar" pra ler ou escrever um artigo.');
  } else {
    falarVozBlog('Modo voz ativado. Você quer ler um artigo ou escrever um novo? Fala "ler" ou "escrever".');
  }
}

function _criarReconhecimentoBlog(SpeechRecognitionApi){
  _vozBlogReconhecimento = new SpeechRecognitionApi();
  _vozBlogReconhecimento.lang = 'pt-BR';
  _vozBlogReconhecimento.continuous = true;
  _vozBlogReconhecimento.interimResults = false;

  _vozBlogReconhecimento.onstart = () => {
    _vozBlogUltimoSinalDeVida = Date.now();
    _vozBlogTentativasReconexao = 0;
  };

  _vozBlogReconhecimento.onresult = (event) => {
    _vozBlogUltimoSinalDeVida = Date.now();
    if(!_vozBlogAtiva) return;
    const ultimo = event.results[event.results.length - 1];
    if(!ultimo || !ultimo.isFinal) return;
    const transcricao = (ultimo[0] && ultimo[0].transcript || '').trim();
    if(!transcricao) return;
    document.getElementById('voz-blog-transcricao').textContent = '🗣️ "' + transcricao + '"';

    if(_aguardandoAtivacaoBlog){
      const t = normalizarTextoBlog(transcricao);
      if(t.includes('ativar') || t.includes('guiazap')){
        _aguardandoAtivacaoBlog = false;
        _estadoRedacaoBlog = { etapa: 'escolher_ler_ou_escrever' };
        falarVozBlog('Modo voz ativado. Você quer ler um artigo ou escrever um novo? Fala "ler" ou "escrever".');
      }
      return;
    }

    processarComandoVozBlog(transcricao);
  };

  _vozBlogReconhecimento.onend = () => {
    _vozBlogUltimoSinalDeVida = Date.now();
    if(_vozBlogAtiva && !_vozBlogFalando){
      try{ _vozBlogReconhecimento.start(); } catch(e){}
    }
  };

  _vozBlogReconhecimento.onerror = (event) => {
    if(event.error === 'not-allowed'){
      falarVozBlog('Preciso de permissão pra usar o microfone. Se você já permitiu antes e continua aparecendo, verifica as permissões do aplicativo nas configurações do celular.');
      pararModoVozBlog();
      return;
    }
    _vozBlogUltimoSinalDeVida = Date.now();
  };

  try{ _vozBlogReconhecimento.start(); } catch(e){}
  _vozBlogUltimoSinalDeVida = Date.now();
}

function _iniciarVigiaVozBlog(SpeechRecognitionApi){
  clearInterval(_vozBlogVigia);
  _vozBlogVigia = setInterval(() => {
    if(!_vozBlogAtiva){ clearInterval(_vozBlogVigia); return; }
    if(_vozBlogFalando) return;

    const semSinalHa = Date.now() - _vozBlogUltimoSinalDeVida;
    if(semSinalHa > 8000){
      _vozBlogTentativasReconexao++;
      console.warn('modo voz do Blog parece ter travado, recriando (tentativa ' + _vozBlogTentativasReconexao + ')');
      try{ _vozBlogReconhecimento.onend = null; _vozBlogReconhecimento.onerror = null; _vozBlogReconhecimento.stop(); } catch(e){}
      _criarReconhecimentoBlog(SpeechRecognitionApi);

      if(_vozBlogTentativasReconexao === 2){
        falarVozBlog('O microfone parou de responder. Reconectando...');
      }
    }
  }, 4000);
}

function pararModoVozBlog(){
  _vozBlogAtiva = false;
  if(typeof desativarModoVozPermanente === 'function') desativarModoVozPermanente();
  _estadoRedacaoBlog = null;
  clearInterval(_vozBlogVigia);
  if(typeof pararBiometriaSeAtiva === 'function') pararBiometriaSeAtiva();
  if(_vozBlogReconhecimento){
    _vozBlogReconhecimento.onresult = null;
    _vozBlogReconhecimento.onend = null;
    _vozBlogReconhecimento.onerror = null;
    try{ _vozBlogReconhecimento.abort(); } catch(e){}
    _vozBlogReconhecimento = null;
  }
  if(_vozBlogSynth) _vozBlogSynth.cancel();
  const btn = document.getElementById('btn-modo-voz-blog');
  if(btn){
    btn.style.background = '#6b46c1';
    btn.setAttribute('aria-label', 'Redigir artigo por voz, sem tocar na tela');
  }
  const painel = document.getElementById('painel-modo-voz-blog');
  if(painel) painel.style.display = 'none';
  const ind = document.getElementById('voz-blog-indicador');
  if(ind) ind.style.background = '#6b46c1';
}

// Troca palavras de pontuação faladas pelo símbolo de verdade, pra quem
// dita o artigo por voz não precisar escrever manualmente depois. O
// reconhecimento de voz do navegador não insere pontuação sozinho — quem
// dita precisa falar a palavra da pontuação no lugar certo da frase (ex:
// "isso foi bom vírgula não foi" vira "isso foi bom, não foi"). Os
// acentos das palavras normais (não, é, ótimo...) o próprio reconhecimento
// de voz já entrega certos, isso aqui só cuida da pontuação.
function aplicarPontuacaoFalada(texto){
  let t = ' ' + texto.trim() + ' ';
  const trocas = [
    [/\s+ponto de interroga[cç][aã]o\s+/gi, '? '],
    [/\s+ponto de exclama[cç][aã]o\s+/gi, '! '],
    [/\s+interroga[cç][aã]o\s+/gi, '? '],
    [/\s+exclama[cç][aã]o\s+/gi, '! '],
    [/\s+ponto e v[ií]rgula\s+/gi, '; '],
    [/\s+dois pontos\s+/gi, ': '],
    [/\s+reticências\s+/gi, '... '],
    [/\s+ponto final\s+/gi, '. '],
    [/\s+novo par[aá]grafo\s+/gi, '.\n\n'],
    [/\s+nova linha\s+/gi, '.\n'],
    [/\s+abre par[eê]ntese[s]?\s+/gi, ' ('],
    [/\s+fecha par[eê]ntese[s]?\s+/gi, ') '],
    [/\s+abre aspas\s+/gi, ' "'],
    [/\s+fecha aspas\s+/gi, '" '],
    [/\s+v[ií]rgula\s+/gi, ', '],
    [/\s+ponto\s+/gi, '. '],
  ];
  for(const [regex, symbol] of trocas){
    t = t.replace(regex, symbol);
  }
  // Limpa espaço duplicado que a troca possa ter deixado, mas preserva as
  // quebras de linha de parágrafo/linha nova
  t = t.replace(/[ \t]+/g, ' ').trim();
  // Espaço antes de pontuação de fechamento fica feio — remove
  t = t.replace(/\s+([,.;:!?])/g, '$1');
  return t;
}

function falarVozBlog(texto){
  if(!_vozBlogSynth) return;
  _vozBlogFalando = true;
  const ind = document.getElementById('voz-blog-indicador');
  if(ind) ind.style.background = '#e05d5d';
  const status = document.getElementById('voz-blog-status');
  if(status) status.textContent = '🔊 ' + texto;

  _vozBlogSynth.cancel();
  const fala = new SpeechSynthesisUtterance(texto);
  fala.lang = 'pt-BR';
  fala.rate = 1.05;
  fala.onend = () => {
    _vozBlogFalando = false;
    if(ind) ind.style.background = '#22c55e';
    if(status) status.textContent = '🎙️ Pode falar...';
    if(_vozBlogAtiva && _vozBlogReconhecimento){
      try{ _vozBlogReconhecimento.start(); } catch(e){}
    }
  };
  fala.onerror = () => {
    _vozBlogFalando = false;
    if(ind) ind.style.background = '#22c55e';
  };
  _vozBlogSynth.speak(fala);
  setTimeout(function(){
    _vozBlogFalando = false;
    if(_vozBlogReconhecimento){ try{ _vozBlogReconhecimento.start(); } catch(e){} }
  }, 6000);
}

// Última tentativa antes de desistir: manda pra IA ver se o que a pessoa
// falou era um pedido pra ir pra outra página, mesmo dito de um jeito
// inesperado (ex: "mudei de ideia, quero comprar uma coisa"). Se a IA
// achar uma página, navega; se não achar mas tiver uma resposta melhor
// que "não entendi", fala essa resposta; em último caso, fala o texto
// padrão que foi passado.
async function _tentarNavegacaoPorIABlog(textoOriginal, textoPadraoSeNaoEntender){
  if(typeof verificarNavegacaoUniversalPorVozComIA !== 'function'){
    falarVozBlog(textoPadraoSeNaoEntender);
    return;
  }
  const destino = await verificarNavegacaoUniversalPorVozComIA(normalizarTextoBlog(textoOriginal), textoOriginal, 'blog.html');
  if(destino && destino.url){
    localStorage.setItem('retomarModoVozAoCarregar', '1');
    falarVozBlog(destino.fala);
    setTimeout(() => { window.location.href = destino.url; }, 1200);
  } else if(destino && destino.fala){
    falarVozBlog(destino.fala);
  } else {
    falarVozBlog(textoPadraoSeNaoEntender);
  }
}

function _tratarResultadoBuscaVozBlog(encontrados, estado, textoNorm){
  if(encontrados.length === 0){
    falarVozBlog('Não encontrei nenhum artigo com isso. Pode falar outra palavra?');
    return;
  }
  if(encontrados.length === 1){
    _lerArtigoEmVozAlta(encontrados[0], estado);
    return;
  }
  estado.etapa = 'ler_escolher_qual';
  estado.opcoes = encontrados;
  const titulos = encontrados.map(p => p.titulo).join('. ');
  falarVozBlog(`Encontrei ${encontrados.length} artigos: ${titulos}. Qual você quer ouvir? Fala uma palavra do título.`);
}

function _quebrarConteudoEmTrechosBlog(texto){
  // Fala em pedaços de ~1 ou 2 frases — utterances muito longas às vezes
  // são cortadas pela síntese de voz do navegador, principalmente no Android
  const frases = texto.match(/[^.!?]+[.!?]+|\s*[^.!?]+$/g) || [texto];
  const trechos = [];
  let atual = '';
  for(const frase of frases){
    if((atual + frase).length > 220 && atual){
      trechos.push(atual.trim());
      atual = frase;
    } else {
      atual += frase;
    }
  }
  if(atual.trim()) trechos.push(atual.trim());
  return trechos;
}

function _lerArtigoEmVozAlta(post, estado){
  const trechos = [
    `Lendo: ${post.titulo}, por ${post.autor_nome}${post.tema ? ', tema ' + post.tema : ''}.`,
    ..._quebrarConteudoEmTrechosBlog(post.conteudo)
  ];
  estado.etapa = 'ler_depois_do_artigo';

  const ind = document.getElementById('voz-blog-indicador');
  const status = document.getElementById('voz-blog-status');
  _vozBlogFalando = true;
  if(ind) ind.style.background = '#e05d5d';

  let indice = 0;
  function proximoTrecho(){
    if(indice >= trechos.length){
      _vozBlogFalando = false;
      falarVozBlog('Quer ler outro artigo, escrever um novo, ou parar?');
      return;
    }
    if(status) status.textContent = '🔊 lendo artigo... (' + (indice + 1) + '/' + trechos.length + ')';
    const fala = new SpeechSynthesisUtterance(trechos[indice]);
    fala.lang = 'pt-BR';
    fala.rate = 1.05;
    fala.onend = () => { indice++; proximoTrecho(); };
    fala.onerror = () => { indice++; proximoTrecho(); };
    _vozBlogSynth.speak(fala);
  }
  proximoTrecho();
}

async function processarComandoVozBlog(transcricao){
  if(_vozBlogSynth) try{ _vozBlogSynth.cancel(); } catch(e){}
  _vozBlogFalando = false;
  if(!_estadoRedacaoBlog || _vozBlogFalando) return;

  const textoNorm = normalizarTextoBlog(transcricao);
  const estado = _estadoRedacaoBlog;

  const _ehPararBl = textoNorm === 'cancelar' || textoNorm === 'parar' || textoNorm === 'sair' || textoNorm === 'desligar';
  if(!_ehPararBl && typeof comandoDeVozAutorizado === 'function' && !comandoDeVozAutorizado()){
    return;
  }

  // Comando de navegação universal — funciona igual em todas as páginas
  // com modo voz. IMPORTANTE: só checa isso fora das etapas onde a fala
  // é DADO sendo ditado (nome, email, título, tema, conteúdo) — senão um
  // artigo que mencione "blog" ou "vagas" no meio do texto ia disparar
  // uma navegação sem querer.
  const _etapasDeDadosBlog = ['nome', 'email', 'titulo', 'tema', 'conteudo'];
  if(!_etapasDeDadosBlog.includes(estado.etapa) && typeof verificarNavegacaoUniversalPorVoz === 'function'){
    const destinoUniversal = verificarNavegacaoUniversalPorVoz(textoNorm, 'blog.html');
    if(destinoUniversal){
      localStorage.setItem('retomarModoVozAoCarregar', '1');
      falarVozBlog(destinoUniversal.fala);
      setTimeout(() => { window.location.href = destinoUniversal.url; }, 1200);
      return;
    }
  }

  // Comandos globais. "desligar"/"sair" desliga o modo voz de vez —
  // "parar"/"cancelar" só encerra a ação atual (ex: parar de ler um
  // artigo), mas o modo voz continua ativo, esperando o próximo comando.
  // Isso é importante pra pessoa poder navegar pro resto do site sem
  // precisar reativar o microfone toda hora.
  if(textoNorm === 'sair' || textoNorm === 'desligar'){
    falarVozBlog('Modo voz desligado.');
    setTimeout(pararModoVozBlog, 1200);
    return;
  }
  if(textoNorm === 'parar' || textoNorm === 'cancelar'){
    estado.etapa = 'escolher_ler_ou_escrever';
    falarVozBlog('Tudo bem. O modo voz continua ativo. Pode pedir outra coisa, tipo ir pra vitrine, ou fala "ler" ou "escrever" pra continuar aqui no blog.');
    return;
  }

  if(estado.etapa === 'escolher_ler_ou_escrever'){
    if(textoNorm.includes('ler') || textoNorm.includes('ouvir')){
      estado.etapa = 'ler_escolher_busca';
      falarVozBlog('Quer buscar por tema, título ou autor?');
      return;
    }
    if(textoNorm.includes('escrever') || textoNorm.includes('escrita') || textoNorm.includes('novo artigo')){
      estado.etapa = 'nome';
      falarVozBlog('Vamos escrever um artigo novo. Qual o seu nome de autor?');
      return;
    }
    await _tentarNavegacaoPorIABlog(transcricao, 'Não entendi. Fala "ler" pra ouvir um artigo, ou "escrever" pra criar um novo.');
    return;
  }

  if(estado.etapa === 'ler_escolher_busca'){
    if(artigosCarregados.length === 0){
      falarVozBlog('Ainda não tem nenhum artigo publicado no blog. Quer escrever o primeiro? Fala "sim" ou "não".');
      estado.etapa = 'ler_oferecer_escrever_primeiro';
      return;
    }

    if(textoNorm.includes('tema')){
      const temas = [...new Set(artigosCarregados.map(p => p.tema).filter(Boolean))];
      if(temas.length === 0){
        falarVozBlog('Nenhum artigo tem tema definido ainda. Tenta buscar por título ou autor.');
        return;
      }
      estado.etapa = 'ler_por_tema';
      falarVozBlog('Os temas que temos são: ' + temas.join(', ') + '. Qual você quer?');
      return;
    }

    if(textoNorm.includes('autor')){
      const autores = [...new Set(artigosCarregados.map(p => p.autor_nome).filter(Boolean))];
      estado.etapa = 'ler_por_autor';
      falarVozBlog('Os autores que temos são: ' + autores.join(', ') + '. Qual você quer ouvir?');
      return;
    }

    if(textoNorm.includes('titulo') || textoNorm.includes('título')){
      estado.etapa = 'ler_por_titulo';
      falarVozBlog('Fala uma palavra do título que você procura.');
      return;
    }

    await _tentarNavegacaoPorIABlog(transcricao, 'Não entendi. Fala "tema", "título" ou "autor".');
    return;
  }

  if(estado.etapa === 'ler_oferecer_escrever_primeiro'){
    if(textoNorm.includes('sim')){
      estado.etapa = 'nome';
      falarVozBlog('Vamos escrever! Qual o seu nome de autor?');
    } else {
      estado.etapa = 'escolher_ler_ou_escrever';
      falarVozBlog('Tudo bem. Modo voz continua ativo — pode pedir outra coisa quando quiser.');
    }
    return;
  }

  if(estado.etapa === 'ler_por_tema'){
    const encontrados = artigosCarregados.filter(p => p.tema && normalizarTextoBlog(p.tema).includes(textoNorm));
    _tratarResultadoBuscaVozBlog(encontrados, estado, textoNorm);
    return;
  }

  if(estado.etapa === 'ler_por_autor'){
    const encontrados = artigosCarregados.filter(p => p.autor_nome && normalizarTextoBlog(p.autor_nome).includes(textoNorm));
    _tratarResultadoBuscaVozBlog(encontrados, estado, textoNorm);
    return;
  }

  if(estado.etapa === 'ler_por_titulo'){
    const encontrados = artigosCarregados.filter(p => normalizarTextoBlog(p.titulo).includes(textoNorm));
    _tratarResultadoBuscaVozBlog(encontrados, estado, textoNorm);
    return;
  }

  if(estado.etapa === 'ler_escolher_qual'){
    const escolhido = estado.opcoes.find(p => normalizarTextoBlog(p.titulo).includes(textoNorm));
    if(!escolhido){
      falarVozBlog('Não achei esse título na lista. Pode repetir uma palavra do título que você quer?');
      return;
    }
    _lerArtigoEmVozAlta(escolhido, estado);
    return;
  }

  if(estado.etapa === 'ler_depois_do_artigo'){
    if(textoNorm.includes('outro') || textoNorm.includes('ler mais') || textoNorm.includes('mais um')){
      estado.etapa = 'ler_escolher_busca';
      falarVozBlog('Quer buscar por tema, título ou autor?');
    } else if(textoNorm.includes('escrever')){
      estado.etapa = 'nome';
      falarVozBlog('Vamos escrever um artigo novo. Qual o seu nome de autor?');
    } else {
      // Não entendeu de cara — mas antes de desistir, tenta a IA (talvez
      // seja um pedido pra ir pra outra página)
      await _tentarNavegacaoPorIABlog(transcricao, 'Não entendi. Fala "ler outro", "escrever", ou pede outra coisa, tipo ir pra vitrine.');
    }
    return;
  }

  if(estado.etapa === 'nome'){
    document.getElementById('blog-autor').value = transcricao.trim();
    estado.etapa = 'email';
    falarVozBlog('Nome anotado. Qual seu e-mail? Pode falar "pular" se não quiser informar.');
    return;
  }

  if(estado.etapa === 'email'){
    if(textoNorm === 'pular' || textoNorm === 'nao' || textoNorm === 'não' || textoNorm === 'sem email'){
      document.getElementById('blog-email').value = '';
    } else {
      // Tenta montar um e-mail a partir da fala (ex: "joao arroba gmail ponto com")
      let email = transcricao.trim()
        .replace(/\s+arroba\s+/gi, '@')
        .replace(/\s+at\s+/gi, '@')
        .replace(/\s+ponto\s+/gi, '.')
        .replace(/\s+/g, '')
        .toLowerCase();
      document.getElementById('blog-email').value = email;
    }
    estado.etapa = 'titulo';
    falarVozBlog('Agora fala o título do artigo.');
    return;
  }

  if(estado.etapa === 'titulo'){
    document.getElementById('blog-titulo').value = transcricao.trim();
    estado.etapa = 'tema';
    falarVozBlog('Título anotado. Qual o tema do artigo? Por exemplo, dicas pra contratar, empreendedorismo, ou novidades. Pode falar "pular" se não quiser definir.');
    return;
  }

  if(estado.etapa === 'tema'){
    if(!(textoNorm === 'pular' || textoNorm === 'nenhum' || textoNorm === 'sem tema')){
      document.getElementById('blog-tema').value = transcricao.trim();
    }
    estado.etapa = 'conteudo';
    document.getElementById('blog-conteudo').value = '';
    falarVozBlog('Tema anotado. Agora dite o conteúdo do artigo. Quando terminar, fala "pronto" ou "terminei".');
    return;
  }

  if(estado.etapa === 'conteudo'){
    if(textoNorm === 'pronto' || textoNorm === 'terminei' || textoNorm === 'finalizei' || textoNorm === 'acabou' || textoNorm === 'enviar' || textoNorm === 'concluir'){
      const conteudoAtual = document.getElementById('blog-conteudo').value.trim();
      if(conteudoAtual.length < 200){
        falarVozBlog('O artigo ainda está curto. Precisa de pelo menos duzentos caracteres. Continue ditando, ou fala "pronto" de novo quando terminar.');
        return;
      }
      estado.etapa = 'confirmar';
      falarVozBlog('Artigo com ' + conteudoAtual.length + ' caracteres. Quer enviar pra revisão agora? Fala "sim" ou "não".');
      return;
    }
    // Continua acrescentando ao conteúdo — aplica a pontuação falada
    // (vírgula, ponto, interrogação...) antes de guardar no campo
    const campo = document.getElementById('blog-conteudo');
    const anterior = campo.value.trim();
    const trechoComPontuacao = aplicarPontuacaoFalada(transcricao);
    campo.value = anterior ? (anterior + ' ' + trechoComPontuacao) : trechoComPontuacao;
    const chars = campo.value.length;
    document.getElementById('voz-blog-status').textContent = '📝 ' + chars + ' caracteres — continue ou diga "pronto"';
    return;
  }

  if(estado.etapa === 'confirmar'){
    if(textoNorm.includes('sim') || textoNorm.includes('enviar') || textoNorm.includes('confirma') || textoNorm.includes('pode enviar')){
      falarVozBlog('Enviando artigo pra revisão...');
      await enviarArtigo();
      const msg = document.getElementById('blog-msg').textContent || '';
      if(msg.includes('publicado')){
        falarVozBlog('Seu artigo foi aprovado e já está publicado no blog! Modo voz continua ativo, pode pedir outra coisa.');
      } else if(msg.includes('não passou')){
        falarVozBlog('Seu artigo não passou na revisão automática. ' + msg.split('Motivo:')[1]?.split('.')[0] || 'Confere o motivo na tela.');
      } else if(msg.includes('revisado em breve') || msg.includes('✓')){
        falarVozBlog('Artigo enviado! Ele aparece no blog assim que for aprovado. Modo voz continua ativo, pode pedir outra coisa.');
      } else {
        falarVozBlog('Houve um problema ao enviar. Você pode tentar de novo pelo formulário.');
      }
      estado.etapa = 'escolher_ler_ou_escrever';
    } else if(textoNorm.includes('nao') || textoNorm.includes('não') || textoNorm.includes('cancelar')){
      estado.etapa = 'escolher_ler_ou_escrever';
      falarVozBlog('Tudo bem. O artigo ficou preenchido na tela. Modo voz continua ativo, pode pedir outra coisa quando quiser.');
    } else {
      falarVozBlog('Fala "sim" pra enviar, ou "não" pra só deixar preenchido na tela.');
    }
    return;
  }
}

window.addEventListener('pagehide', function(){
  if(_vozBlogAtiva){
    localStorage.setItem('retomarModoVozAoCarregar', '1');
  }
});

window.addEventListener('pageshow', function(event){
  if(event.persisted){
    if(_vozBlogReconhecimento){
      try{
        _vozBlogReconhecimento.onresult = null;
        _vozBlogReconhecimento.onend = null;
        _vozBlogReconhecimento.onerror = null;
        _vozBlogReconhecimento.abort();
      } catch(e){}
      _vozBlogReconhecimento = null;
    }
    clearInterval(_vozBlogVigia);
    _vozBlogAtiva = false;
    const btn = document.getElementById('btn-modo-voz-blog');
    if(btn) btn.style.background = '#6b46c1';
    const painel = document.getElementById('painel-modo-voz-blog');
    if(painel) painel.style.display = 'none';
  }
});
