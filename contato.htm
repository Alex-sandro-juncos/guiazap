<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fale conosco — GuiaZap</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .contato-wrap { max-width: 480px; margin: 40px auto; padding: 0 20px; text-align: center; }
  .contato-wrap p { color: #555; margin-bottom: 26px; }
  .contato-card {
    background: var(--cinza-card);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  }
  .contato-card .rotulo { font-size: 0.78rem; color: #8a8270; margin-bottom: 6px; }
  .contato-card .valor { font-size: 1.05rem; font-weight: 700; color: #1c1c1c; margin-bottom: 14px; }
  .contato-btn {
    display: inline-block;
    background: var(--verde-whats);
    color: white;
    padding: 12px 22px;
    border-radius: 50px;
    font-weight: 700;
    text-decoration: none;
    font-size: 0.9rem;
  }
  .contato-btn.email { background: var(--verde-escuro); }
  .contato-btn.copiar { background: transparent; border: 1.5px solid var(--verde-escuro); color: var(--verde-escuro); margin-left: 8px; }
  .contato-btn.copiar-solo { background: var(--verde-escuro); border: none; }
  .copiar-msg { display: block; font-size: 0.78rem; color: var(--verde-escuro); margin-top: 8px; }
  .voltar { display: inline-block; margin-top: 10px; color: var(--verde-escuro); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<header><div class="logo">GuiaZap</div><p>Fale conosco</p></header>
<div class="contato-wrap">
  <p>Tem alguma dúvida, sugestão ou precisa de ajuda com seu cadastro? Fale com a gente por um dos canais abaixo.</p>

  <div class="contato-card">
    <div class="rotulo">WhatsApp</div>
    <div class="valor">(46) 99920-9402</div>
    <a class="contato-btn" href="https://wa.me/5546999209402" target="_blank">Chamar no WhatsApp</a>
  </div>

  <div class="contato-card">
    <div class="rotulo">E-mail</div>
    <div class="valor">contato@guiazap.shop</div>
    <button class="contato-btn copiar-solo" onclick="copiarEmail()">Copiar e-mail</button>
    <span id="copiar-msg" class="copiar-msg"></span>
  </div>

  <div class="contato-card">
    <div class="rotulo" style="margin-bottom:8px;">Reclamação ou sugestão sobre o site</div>
    <select id="feedback-tipo" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; margin-bottom:10px;">
      <option value="sugestao">Sugestão</option>
      <option value="reclamacao">Reclamação</option>
    </select>
    <textarea id="feedback-mensagem" rows="4" placeholder="Conte pra gente o que achou, ou o que podemos melhorar" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; margin-bottom:10px;"></textarea>
    <button class="contato-btn copiar-solo" style="border:none; width:100%; cursor:pointer;" onclick="enviarFeedbackSite()">Enviar</button>
    <div id="feedback-msg" style="font-size:0.8rem; margin-top:8px;"></div>
  </div>

  <a href="index.html" class="voltar">← Voltar ao GuiaZap</a>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
function copiarEmail(){
  navigator.clipboard.writeText('contato@guiazap.shop').then(() => {
    document.getElementById('copiar-msg').textContent = 'e-mail copiado!';
  });
}

const supabaseClientContato = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function enviarFeedbackSite(){
  const tipo = document.getElementById('feedback-tipo').value;
  const mensagem = document.getElementById('feedback-mensagem').value.trim();
  const msg = document.getElementById('feedback-msg');

  if(!mensagem){ msg.textContent = 'Escreva sua mensagem antes de enviar.'; msg.style.color = '#a4402f'; return; }

  msg.textContent = 'enviando...';
  const { error } = await supabaseClientContato.from('feedback_site').insert({ tipo, mensagem });
  if(error){ console.error(error); msg.textContent = 'erro ao enviar, tente novamente'; msg.style.color = '#a4402f'; return; }

  msg.textContent = 'Obrigado! Sua mensagem foi enviada.';
  msg.style.color = 'var(--verde-escuro)';
  document.getElementById('feedback-mensagem').value = '';
}
</script>
</body>
</html>
