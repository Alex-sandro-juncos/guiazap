<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório — GuiaZap Premium</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<link rel="stylesheet" href="css/style.css">
<style>
  .rel-wrap { max-width: 700px; margin: 0 auto; padding: 20px 15px 50px; }
  .voltar { display: inline-block; margin-bottom: 16px; color: var(--verde-escuro); font-weight: 600; text-decoration: none; }
  .rel-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .rel-card { background: white; border-radius: 12px; padding: 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .rel-card .numero { font-size: 1.8rem; font-weight: 800; color: var(--verde-escuro); }
  .rel-card .label { font-size: 0.75rem; color: #888; margin-top: 2px; }
  .rel-grafico-box { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .rel-grafico-box h3 { font-size: 0.9rem; color: var(--verde-escuro); margin-bottom: 10px; }
  .upsell-box { text-align: center; padding: 40px 20px; }
  .select-empresa-rel { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 16px; }
</style>
</head>
<body>
<header><div class="logo">GuiaZap</div><p>Relatório visual (Premium)</p></header>
<button type="button" class="btn-modo-escuro-solto" onclick="toggleModoEscuro()" id="btn-modo-escuro" style="display:block; margin:10px auto 0;">🌙 Modo escuro</button>
<div class="rel-wrap">
  <a href="index.html" class="voltar">← Voltar ao GuiaZap</a>
  <div id="rel-conteudo">Carregando...</div>
</div>

<script src="config.js"></script>
<script>
const supabaseClientRel = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let meusCadastrosRel = [];
let graficoAtual = null;

function mostrarUpsellRel(container, texto){
  container.innerHTML = `<div class="upsell-box"><p>${texto}</p><a href="pacotes.html" class="btn-escolher" style="display:inline-block; margin-top:10px;">Ver Pacote Premium</a></div>`;
}

async function initRelatorio(){
  const container = document.getElementById('rel-conteudo');
  const { data: { session } } = await supabaseClientRel.auth.getSession();

  if(!session){
    mostrarUpsellRel(container, 'Você precisa estar logado com uma empresa Premium pra acessar o relatório visual.');
    return;
  }

  const { data: perfis } = await supabaseClientRel
    .from('profissionais')
    .select('id, name')
    .eq('user_id', session.user.id)
    .eq('plano', 'premium')
    .eq('status_pagamento', 'ativo');

  if(!perfis || perfis.length === 0){
    mostrarUpsellRel(container, 'O relatório visual é exclusivo pro Pacote Premium. Faça upgrade pra ver gráficos de visualizações e cliques no WhatsApp.');
    return;
  }

  meusCadastrosRel = perfis;

  container.innerHTML = `
    ${perfis.length > 1 ? `<select class="select-empresa-rel" id="rel-select-empresa" onchange="carregarRelatorio(this.value)">${perfis.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}</select>` : ''}
    <div class="rel-cards">
      <div class="rel-card"><div class="numero" id="rel-total-views">-</div><div class="label">👁️ Visualizações (30 dias)</div></div>
      <div class="rel-card"><div class="numero" id="rel-total-clicks">-</div><div class="label">💬 Cliques no WhatsApp (30 dias)</div></div>
    </div>
    <div class="rel-grafico-box">
      <h3>📈 Últimos 30 dias</h3>
      <canvas id="rel-grafico" height="200"></canvas>
    </div>
  `;

  carregarRelatorio(perfis[0].id);
}

async function carregarRelatorio(profissionalId){
  const trintaDiasAtras = new Date();
  trintaDiasAtras.setDate(trintaDiasAtras.getDate() - 30);

  const { data: eventos } = await supabaseClientRel
    .from('eventos_analytics')
    .select('tipo, created_at')
    .eq('profissional_id', profissionalId)
    .gte('created_at', trintaDiasAtras.toISOString());

  const views = (eventos || []).filter(e => e.tipo === 'visualizacao');
  const clicks = (eventos || []).filter(e => e.tipo === 'whatsapp_click');

  document.getElementById('rel-total-views').textContent = views.length;
  document.getElementById('rel-total-clicks').textContent = clicks.length;

  // Monta os últimos 30 dias, contando quantos eventos de cada tipo teve em cada dia
  const dias = [];
  const viewsPorDia = [];
  const clicksPorDia = [];

  for(let i = 29; i >= 0; i--){
    const dia = new Date();
    dia.setDate(dia.getDate() - i);
    const diaTexto = dia.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    dias.push(diaTexto);

    const contarNesseDia = (lista) => lista.filter(e => {
      const dataEvento = new Date(e.created_at);
      return dataEvento.toDateString() === dia.toDateString();
    }).length;

    viewsPorDia.push(contarNesseDia(views));
    clicksPorDia.push(contarNesseDia(clicks));
  }

  const ctx = document.getElementById('rel-grafico').getContext('2d');
  if(graficoAtual) graficoAtual.destroy();
  graficoAtual = new Chart(ctx, {
    type: 'line',
    data: {
      labels: dias,
      datasets: [
        { label: 'Visualizações', data: viewsPorDia, borderColor: '#25D366', backgroundColor: 'rgba(37,211,102,0.1)', tension: 0.3 },
        { label: 'Cliques no WhatsApp', data: clicksPorDia, borderColor: '#0a4a6b', backgroundColor: 'rgba(10,74,107,0.1)', tension: 0.3 }
      ]
    },
    options: {
      responsive: true,
      scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
    }
  });
}

initRelatorio();
</script>
<script src="js/modo-escuro.js"></script>
</body>
