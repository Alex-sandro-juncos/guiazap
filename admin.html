<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — GuiaZap</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
  .admin-wrap { max-width: 600px; margin: 0 auto; padding: 20px 15px 60px; }
  .admin-login { max-width: 360px; margin: 60px auto; text-align: center; }
  .admin-login input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; }
  .admin-login button {
    width: 100%; padding: 10px; background: var(--verde-whats); color: white;
    border: none; border-radius: 8px; font-weight: 700; cursor: pointer;
  }
  .admin-msg { font-size: 0.8rem; color: #a4402f; margin-top: 8px; }
  .admin-abas { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .admin-aba-btn {
    flex: 1; min-width: 100px; padding: 9px; border: 1.5px solid var(--verde-escuro);
    background: transparent; color: var(--verde-escuro); border-radius: 8px;
    font-weight: 700; font-size: 0.78rem; cursor: pointer;
  }
  .admin-aba-btn.ativa { background: var(--verde-escuro); color: white; }
  .admin-item {
    background: var(--cinza-card); border-radius: 10px; padding: 12px; margin-bottom: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .admin-item .tipo { font-weight: 700; color: var(--verde-escuro); font-size: 0.85rem; }
  .admin-item .tipo.reclamacao, .admin-item .tipo.den { color: #a4402f; }
  .admin-item .mensagem { margin: 6px 0; font-size: 0.88rem; }
  .admin-item .meta { font-size: 0.72rem; color: #888; }
  .admin-vazio { text-align: center; color: #888; padding: 30px; }
  .admin-acoes { display: flex; gap: 8px; margin-top: 8px; }
  .admin-btn-suspender, .admin-btn-excluir, .admin-btn-ativar, .admin-btn-verificar, .admin-btn-plano {
    border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem;
    font-weight: 700; cursor: pointer; color: white;
  }
  .admin-btn-suspender { background: #d97706; }
  .admin-btn-excluir { background: #a4402f; }
  .admin-btn-ativar { background: var(--verde-whats); }
  .admin-btn-verificar { background: #1877F2; }
  .admin-btn-plano { background: #6b46c1; }
  .admin-btn-link { background: #0a4a6b; }
</style>
</head>
<body>
<header><div class="logo">GuiaZap</div><p>Painel Admin</p></header>

<div id="admin-login-box" class="admin-login">
  <h2 style="margin-bottom:14px;">Entrar</h2>
  <input id="admin-email" type="email" placeholder="Seu e-mail">
  <input id="admin-senha" type="password" placeholder="Senha">
  <button onclick="loginAdmin()">Entrar</button>
  <div class="admin-msg" id="admin-login-msg"></div>
</div>

<div id="admin-conteudo" class="admin-wrap" style="display:none;">
  <div class="admin-abas">
    <button class="admin-aba-btn ativa" id="aba-feedback" onclick="mostrarAbaAdmin('feedback')">💬 Feedback</button>
    <button class="admin-aba-btn" id="aba-denuncias" onclick="mostrarAbaAdmin('denuncias')">🚩 Denúncias</button>
    <button class="admin-aba-btn" id="aba-mensagens" onclick="mostrarAbaAdmin('mensagens')">📩 Msgs empresas</button>
    <button class="admin-aba-btn" id="aba-empresas" onclick="mostrarAbaAdmin('empresas')">🏢 Empresas</button>
    <button class="admin-aba-btn" id="aba-produtos" onclick="mostrarAbaAdmin('produtos')">📦 Produtos</button>
    <button class="admin-aba-btn" id="aba-verificacao" onclick="mostrarAbaAdmin('verificacao')">🔵 Selo Verificado</button>
  </div>
  <button type="button" id="btn-exportar-emails" onclick="exportarEmails()" style="display:none; margin-bottom:14px; background:#0a4a6b; color:white; border:none; padding:9px 16px; border-radius:8px; font-weight:700; font-size:0.8rem; cursor:pointer;">⬇ Exportar e-mails (.csv)</button>
  <input type="text" id="admin-busca" placeholder="🔍 Buscar..." oninput="renderAdmin()" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:0.9rem; margin-bottom:14px;">
  <div id="admin-lista"></div>
</div>

<script src="config.js"></script>
<script>
const supabaseClientAdmin = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let dadosAdmin = null;
let abaAtual = 'feedback';

async function loginAdmin(){
  const email = document.getElementById('admin-email').value.trim();
  const senha = document.getElementById('admin-senha').value;
  const msg = document.getElementById('admin-login-msg');

  msg.textContent = 'entrando...';
  const { error } = await supabaseClientAdmin.auth.signInWithPassword({ email, password: senha });
  if(error){ msg.textContent = error.message; return; }

  await carregarDadosAdmin();
}

async function carregarDadosAdmin(){
  const { data: { session } } = await supabaseClientAdmin.auth.getSession();
  if(!session){ return; }

  const resp = await fetch('/.netlify/functions/admin-dados', {
    headers: { Authorization: `Bearer ${session.access_token}` }
  });

  if(!resp.ok){
    document.getElementById('admin-login-msg').textContent = 'Acesso negado — esse e-mail não é administrador.';
    return;
  }

  dadosAdmin = await resp.json();
  document.getElementById('admin-login-box').style.display = 'none';
  document.getElementById('admin-conteudo').style.display = 'block';
  renderAdmin();
}

function mostrarAbaAdmin(aba){
  abaAtual = aba;
  ['feedback','denuncias','mensagens','empresas','produtos','verificacao'].forEach(a => {
    document.getElementById('aba-' + a).classList.toggle('ativa', aba === a);
  });
  document.getElementById('btn-exportar-emails').style.display = aba === 'empresas' ? 'block' : 'none';
  renderAdmin();
}

function exportarEmails(){
  if(!dadosAdmin || !dadosAdmin.profissionais) return;

  const linhas = [['Nome', 'E-mail', 'Status', 'Plano']];
  dadosAdmin.profissionais.forEach(p => {
    linhas.push([p.name, p.user_email || '', p.status_pagamento, p.plano]);
  });

  const csv = linhas.map(linha => linha.map(campo => `"${(campo || '').toString().replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `guiazap-empresas-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

async function enviarLinkAtivacao(profissionalId, nome){
  if(!confirm(`Enviar e-mail com link de ativação para "${nome}"?`)) return;

  const { data: { session } } = await supabaseClientAdmin.auth.getSession();
  const resp = await fetch('/.netlify/functions/admin-enviar-link-ativacao', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({ profissionalId })
  });

  if(!resp.ok){
    alert('Erro ao enviar link.');
    return;
  }
  alert('Link de ativação enviado por e-mail!');
}

async function executarAcaoAdmin(acao, tabela, id, nome){
  const confirmText = acao === 'excluir'
    ? `Tem certeza que quer EXCLUIR "${nome}"? Isso não pode ser desfeito.`
    : acao === 'ativar'
      ? `Ativar "${nome}"? O cadastro volta a aparecer na busca pública.`
      : acao === 'verificar'
        ? `Marcar "${nome}" como verificado? Isso mostra um selo de confiança pros visitantes.`
        : acao === 'desverificar'
          ? `Remover o selo de verificado de "${nome}"?`
          : acao === 'plano_completo'
            ? `Mudar "${nome}" pro Pacote Completo? Ela ganha acesso à Vitrine, sem precisar pagar.`
            : acao === 'plano_basico'
              ? `Mudar "${nome}" pro Pacote Básico? Ela perde o acesso à Vitrine (produtos somem da busca pública, mas continuam salvos).`
              : acao === 'plano_premium'
                ? `Mudar "${nome}" pro Pacote Premium? Ela ganha: até 10 fotos por Story, botão de "Seguir" pros visitantes, e prioridade na fileira de novidades.`
                : acao === 'confirmar_whatsapp_verificacao'
                  ? `Confirmar que "${nome}" mandou a mensagem certa no WhatsApp do GuiaZap?`
                  : acao === 'aprovar_selo'
                    ? `Aprovar o Selo Verificado de "${nome}"? Isso adiciona o ✅ no cadastro dela.`
                    : acao === 'rejeitar_selo'
                      ? `Rejeitar o pedido de Selo Verificado de "${nome}"? Ela vai precisar refazer o processo.`
                      : `Suspender "${nome}"? O cadastro deixa de aparecer na busca pública até ser reativado.`;
  if(!confirm(confirmText)) return;

  const { data: { session } } = await supabaseClientAdmin.auth.getSession();
  const resp = await fetch('/.netlify/functions/admin-acao', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({ acao, tabela, id })
  });

  if(!resp.ok){
    alert('Erro ao executar ação.');
    return;
  }

  alert(acao === 'excluir' ? 'Excluído com sucesso.' : 'Suspenso com sucesso.');
  await carregarDadosAdmin();
}

function formatarData(iso){
  return new Date(iso).toLocaleString('pt-BR');
}

function renderVerificacoesAdmin(busca){
  const lista = document.getElementById('admin-lista');
  if(!dadosAdmin){ lista.innerHTML = ''; return; }

  let pendentes = (dadosAdmin.profissionais || []).filter(p => p.verificacao_status === 'pendente');
  if(busca) pendentes = pendentes.filter(p => normalizarTextoAdmin(p.name).includes(busca));

  if(pendentes.length === 0){
    lista.innerHTML = '<div class="admin-vazio">Nenhuma verificação pendente no momento.</div>';
    return;
  }

  lista.innerHTML = pendentes.map(p => `
    <div class="admin-item">
      <div class="tipo">🔵 ${p.name}</div>
      <div class="meta">Documento (CPF/CNPJ): ${p.documento || 'não informado'}</div>
      <div class="meta">
        📄 Foto do documento:
        ${p.verificacao_documento_url ? `<a href="${p.verificacao_documento_url}" target="_blank">Ver foto enviada</a>` : 'não enviada ainda'}
      </div>
      <div class="meta">📧 E-mail confirmado: ${p.verificacao_email_confirmado ? '✓ Sim' : '✗ Não'}</div>
      <div class="meta">
        💬 WhatsApp confirmado: ${p.verificacao_whatsapp_confirmado ? '✓ Sim' : '✗ Não'}
        ${!p.verificacao_whatsapp_confirmado ? `<button class="admin-btn-plano" onclick="executarAcaoAdmin('confirmar_whatsapp_verificacao', 'profissionais', '${p.id}', '${p.name.replace(/'/g,"\\'")}')">Marcar como confirmado</button>` : ''}
      </div>
      ${p.verificacao_codigo_whatsapp ? `<div class="meta" style="color:#888;">Código esperado no WhatsApp: ${p.verificacao_codigo_whatsapp}</div>` : ''}
      <div class="admin-acoes" style="margin-top:8px;">
        <button class="admin-btn-ativar" onclick="executarAcaoAdmin('aprovar_selo', 'profissionais', '${p.id}', '${p.name.replace(/'/g,"\\'")}')">✅ Aprovar Selo</button>
        <button class="admin-btn-suspender" onclick="executarAcaoAdmin('rejeitar_selo', 'profissionais', '${p.id}', '${p.name.replace(/'/g,"\\'")}')">Rejeitar</button>
      </div>
    </div>
  `).join('');
}

function renderDenunciasAgrupadas(busca){
  const lista = document.getElementById('admin-lista');
  if(!dadosAdmin) { lista.innerHTML = ''; return; }

  // Agrupa denúncias de empresa por profissional_id
  const gruposEmpresa = {};
  (dadosAdmin.denuncias || []).forEach(d => {
    if(busca && !normalizarTextoAdmin(d.motivo + ' ' + (d.descricao || '')).includes(busca)) {
      const empresaCombina = (dadosAdmin.profissionais || []).some(p => p.id === d.profissional_id && normalizarTextoAdmin(p.name).includes(busca));
      if(!empresaCombina) return;
    }
    if(!gruposEmpresa[d.profissional_id]) gruposEmpresa[d.profissional_id] = [];
    gruposEmpresa[d.profissional_id].push(d);
  });

  // Agrupa denúncias de produto por produto_id
  const gruposProduto = {};
  (dadosAdmin.denunciasProdutos || []).forEach(d => {
    if(busca && !normalizarTextoAdmin(d.motivo + ' ' + (d.descricao || '')).includes(busca)) {
      const produtoCombina = (dadosAdmin.produtos || []).some(p => p.id === d.produto_id && normalizarTextoAdmin(p.nome).includes(busca));
      if(!produtoCombina) return;
    }
    if(!gruposProduto[d.produto_id]) gruposProduto[d.produto_id] = [];
    gruposProduto[d.produto_id].push(d);
  });

  const cardsEmpresa = Object.keys(gruposEmpresa).map(profissionalId => {
    const denunciasDoAlvo = gruposEmpresa[profissionalId].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    const empresa = (dadosAdmin.profissionais || []).find(p => p.id === profissionalId);
    const nome = empresa ? empresa.name : '(empresa não encontrada)';
    const ativo = empresa && empresa.status_pagamento === 'ativo';

    return `<div class="admin-item">
      <div class="tipo den">🚩 ${nome} <span style="font-weight:400; color:#888;">— Empresa · ${denunciasDoAlvo.length} denúncia${denunciasDoAlvo.length > 1 ? 's' : ''}</span></div>
      ${denunciasDoAlvo.map(d => `
        <div class="mensagem" style="margin-top:6px; padding-top:6px; border-top:1px solid #eee;">
          <b>${d.motivo}</b>${d.descricao ? ' — ' + d.descricao : ''}
          <div class="meta">${d.denunciante_email || 'anônimo'} · ${formatarData(d.created_at)}</div>
        </div>
      `).join('')}
      ${empresa ? `<div class="admin-acoes" style="margin-top:8px;">
        ${ativo
          ? `<button class="admin-btn-suspender" onclick="executarAcaoAdmin('suspender', 'profissionais', '${profissionalId}', '${nome.replace(/'/g,"\\'")}')">Suspender empresa</button>`
          : `<button class="admin-btn-ativar" onclick="executarAcaoAdmin('ativar', 'profissionais', '${profissionalId}', '${nome.replace(/'/g,"\\'")}')">Reativar empresa</button>`}
        <button class="admin-btn-excluir" onclick="executarAcaoAdmin('excluir', 'profissionais', '${profissionalId}', '${nome.replace(/'/g,"\\'")}')">Excluir empresa</button>
      </div>` : ''}
    </div>`;
  });

  const cardsProduto = Object.keys(gruposProduto).map(produtoId => {
    const denunciasDoAlvo = gruposProduto[produtoId].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    const produto = (dadosAdmin.produtos || []).find(p => p.id === produtoId);
    const nome = produto ? produto.nome : '(produto não encontrado / já excluído)';

    return `<div class="admin-item">
      <div class="tipo den">🚩 ${nome} <span style="font-weight:400; color:#888;">— Produto · ${denunciasDoAlvo.length} denúncia${denunciasDoAlvo.length > 1 ? 's' : ''}</span></div>
      ${denunciasDoAlvo.map(d => `
        <div class="mensagem" style="margin-top:6px; padding-top:6px; border-top:1px solid #eee;">
          <b>${d.motivo}</b>${d.descricao ? ' — ' + d.descricao : ''}
          <div class="meta">${d.denunciante_email || 'anônimo'} · ${formatarData(d.created_at)}</div>
        </div>
      `).join('')}
      ${produto ? `<div class="admin-acoes" style="margin-top:8px;">
        <button class="admin-btn-excluir" onclick="executarAcaoAdmin('excluir', 'produtos', '${produtoId}', '${nome.replace(/'/g,"\\'")}')">Excluir produto</button>
      </div>` : ''}
    </div>`;
  });

  const todosOsCards = [...cardsEmpresa, ...cardsProduto];

  lista.innerHTML = todosOsCards.length === 0
    ? '<div class="admin-vazio">Nada por aqui ainda.</div>'
    : todosOsCards.join('');
}

function normalizarTextoAdmin(str){
  return (str || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function textoBuscavelDoItem(item){
  // Junta os campos relevantes de cada tipo de item, pra buscar em todos de uma vez
  return normalizarTextoAdmin([
    item.name, item.nome, item.cat, item.categoria, item.marca,
    item.cidade, item.user_email, item.remetente_email,
    item.mensagem, item.denunciante_email
  ].filter(Boolean).join(' '));
}

function renderAdmin(){
  const lista = document.getElementById('admin-lista');
  if(!dadosAdmin){ lista.innerHTML = ''; return; }

  const busca = normalizarTextoAdmin(document.getElementById('admin-busca').value);

  let itens = [];
  if(abaAtual === 'feedback') itens = dadosAdmin.feedbackSite;
  if(abaAtual === 'denuncias'){ renderDenunciasAgrupadas(busca); return; }
  if(abaAtual === 'mensagens') itens = dadosAdmin.mensagensEmpresa;
  if(abaAtual === 'empresas') itens = dadosAdmin.profissionais;
  if(abaAtual === 'produtos') itens = dadosAdmin.produtos;
  if(abaAtual === 'verificacao'){ renderVerificacoesAdmin(busca); return; }

  if(busca){
    itens = (itens || []).filter(item => textoBuscavelDoItem(item).includes(busca));
  }

  if(!itens || itens.length === 0){
    lista.innerHTML = '<div class="admin-vazio">Nada por aqui ainda.</div>';
    return;
  }

  lista.innerHTML = itens.map(item => {
    if(abaAtual === 'feedback' || abaAtual === 'mensagens'){
      return `<div class="admin-item">
        <div class="tipo ${item.tipo === 'reclamacao' ? 'reclamacao' : ''}">${item.tipo === 'reclamacao' ? '⚠️ Reclamação' : '💡 Sugestão'}</div>
        <div class="mensagem">${item.mensagem}</div>
        <div class="meta">${item.remetente_email || 'anônimo'} · ${formatarData(item.created_at)}</div>
      </div>`;
    }
    if(abaAtual === 'empresas'){
      const ativo = item.status_pagamento === 'ativo';
      return `<div class="admin-item">
        <div class="tipo">${item.verificado ? '✅ ' : ''}${item.name} <span style="font-weight:400; color:#888; font-size:0.75rem;">(${item.status_pagamento}, plano ${item.plano})</span></div>
        <div class="meta">${item.cat} · ${item.cidade}/${item.estado} · ${item.user_email || ''}</div>
        <div class="admin-acoes">
          ${ativo
            ? `<button class="admin-btn-suspender" onclick="executarAcaoAdmin('suspender', 'profissionais', '${item.id}', '${item.name.replace(/'/g,"\\'")}')">Suspender</button>`
            : `<button class="admin-btn-ativar" onclick="executarAcaoAdmin('ativar', 'profissionais', '${item.id}', '${item.name.replace(/'/g,"\\'")}')">Ativar agora</button>
               <button class="admin-btn-link" onclick="enviarLinkAtivacao('${item.id}', '${item.name.replace(/'/g,"\\'")}')">Enviar link p/ empresa ativar</button>`}
          ${item.verificado
            ? `<button class="admin-btn-verificar" onclick="executarAcaoAdmin('desverificar', 'profissionais', '${item.id}', '${item.name.replace(/'/g,"\\'")}')">Remover selo ✅</button>`
            : `<button class="admin-btn-verificar" onclick="executarAcaoAdmin('verificar', 'profissionais', '${item.id}', '${item.name.replace(/'/g,"\\'")}')">Marcar como verificado</button>`}
          ${item.plano === 'completo'
            ? `<button class="admin-btn-plano" onclick="executarAcaoAdmin('plano_basico', 'profissionais', '${item.id}', '${item.name.replace(/'/g,"\\'")}')">Mudar p/ Básico</button>`
            : `<button class="admin-btn-plano" onclick="executarAcaoAdmin('plano_completo', 'profissionais', '${item.id}', '${item.name.replace(/'/g,"\\'")}')">Mudar p/ Completo</button>`}
          ${item.plano === 'premium'
            ? `<button class="admin-btn-plano" style="background:#6b46c1;" onclick="executarAcaoAdmin('plano_completo', 'profissionais', '${item.id}', '${item.name.replace(/'/g,"\\'")}')">Remover Premium</button>`
            : `<button class="admin-btn-plano" style="background:#6b46c1;" onclick="executarAcaoAdmin('plano_premium', 'profissionais', '${item.id}', '${item.name.replace(/'/g,"\\'")}')">Mudar p/ Premium</button>`}
          <button class="admin-btn-excluir" onclick="executarAcaoAdmin('excluir', 'profissionais', '${item.id}', '${item.name.replace(/'/g,"\\'")}')">Excluir</button>
        </div>
      </div>`;
    }
    if(abaAtual === 'produtos'){
      return `<div class="admin-item">
        <div class="tipo">${item.nome}</div>
        <div class="meta">${item.marca || ''} ${item.categoria ? '· ' + item.categoria : ''} ${item.preco ? '· R$ ' + item.preco : ''}</div>
        <div class="admin-acoes">
          <button class="admin-btn-excluir" onclick="executarAcaoAdmin('excluir', 'produtos', '${item.id}', '${item.nome.replace(/'/g,"\\'")}')">Excluir</button>
        </div>
      </div>`;
    }
    return '';
  }).join('');
}

// Se já estiver logado (sessão anterior), carrega direto
supabaseClientAdmin.auth.getSession().then(({ data: { session } }) => {
  if(session) carregarDadosAdmin();
});
</script>
</body>
</html>
