<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financeiro — GuiaZap</title>
<meta name="description" content="Controle de receitas e despesas da sua empresa no GuiaZap.">
<link rel="stylesheet" href="css/style.css?v=20260925">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<style>
  body.fin-pagina { background: #f7f5f0; }
  .fin-topo {
    background: linear-gradient(90deg, #2a7a2a, #1f5e1f);
    color: white;
    padding: 16px 15px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .fin-topo a.fin-voltar { color: white; text-decoration: none; font-size: 1.3rem; line-height: 1; opacity: 0.9; }
  .fin-topo h1 { font-size: 1.25rem; font-weight: 800; margin: 0; }
  .fin-conteudo { max-width: 560px; margin: 0 auto; padding: 16px 15px 60px; }

  .fin-select-empresa {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #e5e0d5;
    background: white;
    font-size: 0.9rem;
    margin-bottom: 14px;
  }

  .fin-abas { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; }
  .fin-aba {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid #e5e0d5;
    background: white;
    font-size: 0.82rem;
    font-weight: 700;
    color: #555;
    cursor: pointer;
  }
  .fin-aba.ativa { background: #2a7a2a; color: white; border-color: #2a7a2a; }

  .fin-totais { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 18px; }
  .fin-card-total { background: white; border-radius: 12px; padding: 12px 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .fin-card-total .fin-label { font-size: 0.7rem; color: #888; font-weight: 700; text-transform: uppercase; }
  .fin-card-total .fin-valor { font-size: 1.05rem; font-weight: 800; margin-top: 4px; }
  .fin-card-total.receita .fin-valor { color: #2a7a2a; }
  .fin-card-total.despesa .fin-valor { color: #a4402f; }
  .fin-card-total.saldo .fin-valor { color: #1c1c1c; }

  .fin-grafico { display: flex; align-items: flex-end; gap: 6px; height: 90px; margin-bottom: 20px; padding: 0 4px; }
  .fin-barra-dia { flex: 1; display: flex; flex-direction: column-reverse; align-items: center; gap: 1px; height: 100%; }
  .fin-barra-receita { width: 100%; background: #2a7a2a; border-radius: 3px 3px 0 0; min-height: 2px; }
  .fin-barra-despesa { width: 100%; background: #a4402f; border-radius: 0 0 3px 3px; min-height: 2px; }
  .fin-barra-dia-label { font-size: 0.6rem; color: #999; margin-top: 4px; }

  .fin-form-add {
    background: white;
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    margin-bottom: 18px;
  }
  .fin-form-add h3 { font-size: 0.95rem; margin: 0 0 10px; }
  .fin-form-linha { display: flex; gap: 8px; margin-bottom: 8px; }
  .fin-form-linha select, .fin-form-linha input {
    flex: 1;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid #e5e0d5;
    font-size: 0.88rem;
  }
  .fin-btn-add {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #2a7a2a;
    color: white;
    font-weight: 700;
    cursor: pointer;
  }
  .fin-btn-add:disabled { opacity: 0.6; }

  .fin-lista-item {
    background: white;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .fin-lista-icone { font-size: 1.1rem; flex-shrink: 0; }
  .fin-lista-info { flex: 1; min-width: 0; }
  .fin-lista-desc { font-size: 0.88rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fin-lista-meta { font-size: 0.72rem; color: #999; }
  .fin-lista-valor { font-weight: 800; font-size: 0.9rem; white-space: nowrap; }
  .fin-lista-valor.receita { color: #2a7a2a; }
  .fin-lista-valor.despesa { color: #a4402f; }
  .fin-lista-apagar { background: none; border: none; color: #bbb; cursor: pointer; font-size: 1rem; padding: 4px; }

  .fin-vazio { text-align: center; color: #888; padding: 30px 10px; font-size: 0.9rem; }
  .fin-zeca-dica {
    text-align: center;
    font-size: 0.78rem;
    color: #888;
    margin-top: 18px;
  }
  .fin-zeca-dica a { color: #2a7a2a; font-weight: 700; text-decoration: none; }
</style>
</head>
<body class="fin-pagina">

<div class="fin-topo">
  <a href="index.html" class="fin-voltar" title="Voltar">←</a>
  <h1>💰 Financeiro</h1>
</div>
<div class="gz-cross-nav">
  <a href="meular.html">🏠 Meu Lar</a>
  <a href="meuagro.html">🌱 Meu Agro</a>
  <a href="empresa.html">🏢 Empresa</a>
  <a href="zeca.html">💬 Falar com o Zeca</a>
</div>

<div class="fin-conteudo">
  <select id="fin-select-empresa" class="fin-select-empresa" style="display:none;" onchange="finTrocarEmpresa()"></select>

  <div class="fin-abas" id="fin-abas">
    <button type="button" class="fin-aba" data-periodo="hoje" onclick="finTrocarPeriodo('hoje')">Hoje</button>
    <button type="button" class="fin-aba" data-periodo="semana" onclick="finTrocarPeriodo('semana')">Essa semana</button>
    <button type="button" class="fin-aba ativa" data-periodo="mes" onclick="finTrocarPeriodo('mes')">Esse mês</button>
    <button type="button" class="fin-aba" data-periodo="tudo" onclick="finTrocarPeriodo('tudo')">Tudo</button>
  </div>

  <div class="fin-totais">
    <div class="fin-card-total receita"><div class="fin-label">Receitas</div><div class="fin-valor" id="fin-total-receita">R$ 0,00</div></div>
    <div class="fin-card-total despesa"><div class="fin-label">Despesas</div><div class="fin-valor" id="fin-total-despesa">R$ 0,00</div></div>
    <div class="fin-card-total saldo"><div class="fin-label">Saldo</div><div class="fin-valor" id="fin-total-saldo">R$ 0,00</div></div>
  </div>

  <div class="fin-grafico" id="fin-grafico"></div>

  <div class="fin-form-add">
    <h3>Novo lançamento</h3>
    <div class="fin-form-linha">
      <select id="fin-novo-tipo">
        <option value="receita">⬆️ Receita</option>
        <option value="despesa">⬇️ Despesa</option>
      </select>
      <input type="text" id="fin-novo-valor" placeholder="Valor (ex: 80,00)" inputmode="decimal">
    </div>
    <div class="fin-form-linha">
      <input type="text" id="fin-novo-descricao" placeholder="Descrição (ex: venda de bolo)">
    </div>
    <div class="fin-form-linha">
      <input type="text" id="fin-novo-categoria" placeholder="Categoria (opcional)">
    </div>
    <button type="button" class="fin-btn-add" id="fin-btn-add" onclick="finAdicionarLancamento()">Adicionar</button>
  </div>

  <div id="fin-lista"></div>

  <div class="fin-zeca-dica">💬 Também dá pra lançar e consultar falando com o <a href="zeca.html">Zeca</a> — "lança uma venda de 50 reais".</div>
</div>

<script src="config.js"></script>
<script>
const supabaseClientFin = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let finUsuario = null;
let finEmpresas = [];
let finEmpresaAtual = null;
let finPeriodoAtual = 'mes';
let finLancamentos = [];

function finEscapar(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}
function finFmt(v){
  return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',');
}
function finChaveDia(d){
  return d.toLocaleDateString('en-CA');
}

async function initFinanceiro(){
  const { data: { session } } = await supabaseClientFin.auth.getSession();
  if(!session){
    document.querySelector('.fin-conteudo').innerHTML = '<div class="fin-vazio">🔒 Faça login na <a href="index.html">página inicial</a> pra ver o financeiro da sua empresa.</div>';
    return;
  }
  finUsuario = session.user;

  const { data: empresas } = await supabaseClientFin.from('profissionais').select('id, name').eq('user_id', finUsuario.id).eq('status_pagamento', 'ativo');
  finEmpresas = empresas || [];

  if(!finEmpresas.length){
    document.querySelector('.fin-conteudo').innerHTML = '<div class="fin-vazio">Você ainda não tem uma empresa ativa cadastrada.</div>';
    return;
  }

  if(finEmpresas.length > 1){
    const select = document.getElementById('fin-select-empresa');
    select.innerHTML = finEmpresas.map(e => `<option value="${e.id}">${finEscapar(e.name)}</option>`).join('');
    select.style.display = 'block';
  }

  finEmpresaAtual = finEmpresas[0].id;
  await finCarregarLancamentos();
}

function finTrocarEmpresa(){
  finEmpresaAtual = document.getElementById('fin-select-empresa').value;
  finCarregarLancamentos();
}

function finTrocarPeriodo(periodo){
  finPeriodoAtual = periodo;
  document.querySelectorAll('.fin-aba').forEach(b => b.classList.toggle('ativa', b.dataset.periodo === periodo));
  finCarregarLancamentos();
}

function finIntervaloPeriodo(){
  const hoje = new Date();
  const chaveHoje = finChaveDia(hoje);
  if(finPeriodoAtual === 'hoje') return { inicio: chaveHoje, fim: chaveHoje };
  if(finPeriodoAtual === 'tudo') return null;
  if(finPeriodoAtual === 'semana'){
    const diaSemana = hoje.getDay();
    const voltar = diaSemana === 0 ? 6 : diaSemana - 1;
    const inicio = new Date(hoje); inicio.setDate(inicio.getDate() - voltar);
    return { inicio: finChaveDia(inicio), fim: chaveHoje };
  }
  // mes
  const inicio = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  return { inicio: finChaveDia(inicio), fim: chaveHoje };
}

async function finCarregarLancamentos(){
  document.getElementById('fin-lista').innerHTML = '<div class="fin-vazio">Carregando...</div>';
  let query = supabaseClientFin.from('financeiro_lancamentos').select('*').eq('profissional_id', finEmpresaAtual).order('data', { ascending: false }).order('created_at', { ascending: false });
  const intervalo = finIntervaloPeriodo();
  if(intervalo){ query = query.gte('data', intervalo.inicio).lte('data', intervalo.fim); }
  const { data, error } = await query;
  finLancamentos = data || [];
  finRenderTotais();
  finRenderGrafico();
  finRenderLista();
}

function finRenderTotais(){
  const totalReceita = finLancamentos.filter(l => l.tipo === 'receita').reduce((s, l) => s + Number(l.valor), 0);
  const totalDespesa = finLancamentos.filter(l => l.tipo === 'despesa').reduce((s, l) => s + Number(l.valor), 0);
  document.getElementById('fin-total-receita').textContent = finFmt(totalReceita);
  document.getElementById('fin-total-despesa').textContent = finFmt(totalDespesa);
  document.getElementById('fin-total-saldo').textContent = finFmt(totalReceita - totalDespesa);
}

function finRenderGrafico(){
  // Últimos 7 dias corridos, sempre — dá uma visão rápida de tendência
  // independente da aba de período escolhida.
  const dias = [];
  for(let i = 6; i >= 0; i--){
    const d = new Date();
    d.setDate(d.getDate() - i);
    dias.push({ chave: finChaveDia(d), label: d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '') });
  }
  const porDia = {};
  finLancamentos.forEach(l => {
    if(!porDia[l.data]) porDia[l.data] = { receita: 0, despesa: 0 };
    porDia[l.data][l.tipo] += Number(l.valor);
  });
  const maiorValor = Math.max(1, ...dias.map(d => Math.max((porDia[d.chave]?.receita || 0), (porDia[d.chave]?.despesa || 0))));

  document.getElementById('fin-grafico').innerHTML = dias.map(d => {
    const r = porDia[d.chave]?.receita || 0;
    const dp = porDia[d.chave]?.despesa || 0;
    const alturaR = Math.round((r / maiorValor) * 60);
    const alturaD = Math.round((dp / maiorValor) * 60);
    return `<div class="fin-barra-dia" title="${d.label}: receita ${finFmt(r)}, despesa ${finFmt(dp)}">
      <div class="fin-barra-receita" style="height:${alturaR}px;"></div>
      <div class="fin-barra-despesa" style="height:${alturaD}px;"></div>
      <div class="fin-barra-dia-label">${d.label}</div>
    </div>`;
  }).join('');
}

function finRenderLista(){
  const container = document.getElementById('fin-lista');
  if(!finLancamentos.length){
    container.innerHTML = '<div class="fin-vazio">Nenhum lançamento nesse período ainda.</div>';
    return;
  }
  container.innerHTML = finLancamentos.map(l => {
    const dataFmt = new Date(l.data + 'T12:00:00').toLocaleDateString('pt-BR');
    return `<div class="fin-lista-item">
      <div class="fin-lista-icone">${l.tipo === 'receita' ? '⬆️' : '⬇️'}</div>
      <div class="fin-lista-info">
        <div class="fin-lista-desc">${finEscapar(l.descricao)}</div>
        <div class="fin-lista-meta">${dataFmt}${l.categoria ? ' · ' + finEscapar(l.categoria) : ''}</div>
      </div>
      <div class="fin-lista-valor ${l.tipo}">${l.tipo === 'receita' ? '+' : '-'}${finFmt(l.valor)}</div>
      <button type="button" class="fin-lista-apagar" onclick="finApagarLancamento('${l.id}')" title="Apagar">🗑️</button>
    </div>`;
  }).join('');
}

async function finApagarLancamento(id){
  if(!confirm('Apagar esse lançamento?')) return;
  await supabaseClientFin.from('financeiro_lancamentos').delete().eq('id', id);
  finCarregarLancamentos();
}

async function finAdicionarLancamento(){
  const tipo = document.getElementById('fin-novo-tipo').value;
  const valorTexto = document.getElementById('fin-novo-valor').value.replace(/[^\d,.-]/g, '').replace(',', '.');
  const valor = parseFloat(valorTexto);
  const descricao = document.getElementById('fin-novo-descricao').value.trim();
  const categoria = document.getElementById('fin-novo-categoria').value.trim();

  if(!valor || valor <= 0){ alert('Digita um valor válido.'); return; }
  if(!descricao){ alert('Digita uma descrição curta.'); return; }

  const btn = document.getElementById('fin-btn-add');
  btn.disabled = true;
  btn.textContent = 'Adicionando...';

  const { error } = await supabaseClientFin.from('financeiro_lancamentos').insert({
    profissional_id: finEmpresaAtual,
    tipo, descricao, valor,
    categoria: categoria || null
  });

  btn.disabled = false;
  btn.textContent = 'Adicionar';

  if(error){
    alert('Erro ao adicionar: ' + error.message);
    return;
  }

  document.getElementById('fin-novo-valor').value = '';
  document.getElementById('fin-novo-descricao').value = '';
  document.getElementById('fin-novo-categoria').value = '';
  finCarregarLancamentos();
}

initFinanceiro();
</script>
</body>
</html>
