<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GuiaZap — Redefinir senha</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css">
<style>
  .reset-wrap {
    max-width: 400px;
    margin: 60px auto;
    padding: 0 20px;
  }
  .reset-card {
    background: var(--cinza-card);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  .reset-card h2 { margin-bottom: 16px; color: #1c1c1c; }
  .reset-card input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 0.95rem;
    margin-bottom: 12px;
  }
  .reset-card button {
    width: 100%;
    background: var(--verde-whats);
    color: white;
    border: none;
    padding: 13px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
  }
  .reset-msg { font-size: 0.85rem; margin-top: 10px; text-align: center; color: #a4402f; }
  .reset-msg.success { color: var(--verde-escuro); }
</style>
</head>
<body>
<header>
  <div class="logo">GuiaZap</div>
  <p>Redefinir sua senha</p>
</header>

<div class="reset-wrap">
  <div class="reset-card">
    <h2>Nova senha</h2>
    <input id="new-password" type="password" placeholder="Digite a nova senha">
    <input id="confirm-password" type="password" placeholder="Confirme a nova senha">
    <button onclick="updatePassword()">Salvar nova senha</button>
    <div class="reset-msg" id="reset-msg"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function updatePassword(){
  const pass1 = document.getElementById('new-password').value;
  const pass2 = document.getElementById('confirm-password').value;
  const msg = document.getElementById('reset-msg');
  msg.className = 'reset-msg';

  if(!pass1 || pass1.length < 6){ msg.textContent = 'a senha precisa ter pelo menos 6 caracteres'; return; }
  if(pass1 !== pass2){ msg.textContent = 'as senhas não coincidem'; return; }

  msg.textContent = 'salvando...';
  const { error } = await supabaseClient.auth.updateUser({ password: pass1 });
  if(error){ msg.textContent = error.message; return; }

  msg.textContent = 'senha alterada com sucesso! redirecionando...';
  msg.className = 'reset-msg success';
  setTimeout(() => { window.location.href = 'index.html'; }, 2000);
}
</script>
</body>
</html>
