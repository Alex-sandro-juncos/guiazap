<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novidades de quem você segue — GuiaZap</title>
<meta property="og:title" content="Novidades de quem você segue — GuiaZap">
<meta property="og:description" content="Veja as últimas novidades das empresas que você segue no GuiaZap.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://guiazap.shop/feed.html">
<meta property="og:image" content="https://guiazap.shop/favicon-512.png">

<link rel="stylesheet" href="css/style.css">
<style>
  .feed-wrap { max-width: 600px; margin: 0 auto; padding: 20px 15px 50px; }
  .voltar { display: inline-block; margin-bottom: 16px; color: var(--verde-escuro); font-weight: 600; text-decoration: none; }
  .card-feed { background: white; border-radius: 12px; overflow: hidden; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .card-feed img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #eee; }
  .card-feed .info-feed { padding: 12px; }
  .card-feed .empresa-feed { font-size: 0.78rem; color: var(--verde-escuro); font-weight: 700; }
  .card-feed .tipo-feed { font-size: 0.68rem; color: #999; }
  .card-feed .texto-feed { font-size: 0.85rem; color: #333; margin-top: 6px; }
  .card-feed .data-feed { font-size: 0.68rem; color: #999; margin-top: 6px; }
  .vazio-feed { text-align: center; padding: 50px 20px; color: #999; }
</style>
</head>
<body>
<header style="position:relative;">
  <div class="logo">GuiaZap</div><p>Novidades de quem você segue</p>
  <button type="button" id="btn-modo-voz-feed" onclick="toggleModoVozFeed()" title="Ativar modo de voz" style="position:absolute; top:14px; right:14px; background:rgba(255,255,255,0.15); border:none; color:white; width:38px; height:38px; border-radius:50%; font-size:1.1rem; cursor:pointer;">🎙️</button>
</header>

<div id="painel-modo-voz-feed" style="display:none; position:fixed; bottom:16px; left:12px; right:12px; max-width:420px; margin:0 auto; background:#1c1c2e; border-radius:16px; padding:14px; z-index:1700; box-shadow:0 4px 24px rgba(0,0,0,0.4);">
  <div style="display:flex; gap:10px; align-items:flex-start;">
    <div style="width:14px;height:14px;border-radius:50%;background:var(--verde-whats);flex-shrink:0;margin-top:4px;"></div>
    <div style="flex:1;min-width:0;">
      <div id="voz-feed-status" style="color:white;font-weight:700;font-size:0.85rem;">Fala "ler novidades" ou o nome de uma página pra ir</div>
      <div id="voz-feed-transcricao" style="color:#aaa;font-size:0.75rem;margin-top:4px;"></div>
    </div>
    <button type="button" onclick="pararModoVozFeed()" style="background:#a4402f;color:white;border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;flex-shrink:0;">✕</button>
  </div>
</div>
<button type="button" class="btn-modo-escuro-solto" onclick="toggleModoEscuro()" id="btn-modo-escuro" style="display:block; margin:10px auto 0;">🌙</button>
<div class="feed-wrap">
  <a href="index.html" class="voltar">← Voltar ao GuiaZap</a>
  <div id="feed-lista">Carregando...</div>
</div>

<script src="config.js"></script>
<script>
const supabaseClientFeed = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escapeHtmlFeed(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function tempoRelativo(dataStr){
  const diff = Date.now() - new Date(dataStr).getTime();
  const horas = Math.floor(diff / (1000 * 60 * 60));
  if(horas < 1) return 'agora há pouco';
  if(horas < 24) return `há ${horas}h`;
  const dias = Math.floor(horas / 24);
  return `há ${dias} dia${dias > 1 ? 's' : ''}`;
}

async function initFeed(){
  const container = document.getElementById('feed-lista');
  const { data: { session } } = await supabaseClientFeed.auth.getSession();

  if(!session){
    container.innerHTML = '<div class="vazio-feed">Faça login na <a href="index.html">página inicial</a> pra ver as novidades de quem você segue.</div>';
    return;
  }

  const { data: seguindo } = await supabaseClientFeed.from('seguidores').select('profissional_id').eq('user_id', session.user.id);
  const idsSeguindo = (seguindo || []).map(s => s.profissional_id);

  if(idsSeguindo.length === 0){
    container.innerHTML = '<div class="vazio-feed">Você ainda não segue nenhuma empresa.<br>Siga empresas Premium pra ver as novidades delas aqui!</div>';
    return;
  }

  const [{ data: stories }, { data: produtos }] = await Promise.all([
    supabaseClientFeed.from('stories').select('*, profissionais(name)').in('profissional_id', idsSeguindo).order('created_at', { ascending: false }),
    supabaseClientFeed.from('produtos').select('*, profissionais(name)').in('profissional_id', idsSeguindo).order('created_at', { ascending: false }).limit(30)
  ]);

  const itensFeed = [];

  (stories || []).forEach(s => {
    itensFeed.push({
      tipo: 'story',
      empresa: s.profissionais ? s.profissionais.name : '',
      foto: s.fotos && s.fotos[0],
      texto: s.texto,
      data: s.created_at
    });
  });

  (produtos || []).forEach(p => {
    itensFeed.push({
      tipo: 'produto',
      empresa: p.profissionais ? p.profissionais.name : '',
      foto: p.foto,
      texto: `${p.nome}${p.preco ? ' — R$ ' + p.preco : ''}`,
      data: p.created_at
    });
  });

  itensFeed.sort((a, b) => new Date(b.data) - new Date(a.data));

  if(itensFeed.length === 0){
    container.innerHTML = '<div class="vazio-feed">Nenhuma novidade ainda das empresas que você segue.</div>';
    return;
  }

  container.innerHTML = itensFeed.map(item => `
    <div class="card-feed">
      ${item.foto ? `<img src="${escapeHtmlFeed(item.foto)}" loading="lazy">` : ''}
      <div class="info-feed">
        <div class="empresa-feed">${escapeHtmlFeed(item.empresa)}</div>
        <div class="tipo-feed">${item.tipo === 'story' ? '📸 Novidade' : '🛍️ Produto novo'}</div>
        ${item.texto ? `<div class="texto-feed">${escapeHtmlFeed(item.texto)}</div>` : ''}
        <div class="data-feed">${tempoRelativo(item.data)}</div>
      </div>
    </div>
  `).join('');
}

initFeed();

// ---------- MODO VOZ (mãos livres) ----------

let _vozFeedAtiva = false;
let _vozFeedReconhecimento = null;
let _vozFeedVigia = null;
let _vozFeedUltimoSinal = 0;
let _vozFeedFalando = false;
const _vozFeedSynth = window.speechSynthesis;

function toggleModoVozFeed(){
  if(_vozFeedAtiva) pararModoVozFeed();
  else iniciarModoVozFeed();
}

function iniciarModoVozFeed(){
  const Api = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Api){ alert('Seu navegador não suporta comando de voz. Tenta pelo Chrome.'); return; }

  _vozFeedAtiva = true;
  if(typeof ativarModoVozPermanente === 'function') ativarModoVozPermanente();
  document.getElementById('btn-modo-voz-feed').style.background = '#a4402f';
  document.getElementById('painel-modo-voz-feed').style.display = 'block';

  _criarReconhecimentoFeed(Api);
  clearInterval(_vozFeedVigia);
  _vozFeedVigia = setInterval(() => {
    if(!_vozFeedAtiva){ clearInterval(_vozFeedVigia); return; }
    if(_vozFeedFalando) return;
    if(Date.now() - _vozFeedUltimoSinal > 8000){
      try{ _vozFeedReconhecimento.onend = null; _vozFeedReconhecimento.abort(); } catch(e){}
      _criarReconhecimentoFeed(Api);
    }
  }, 4000);

  falarVozFeed('Modo voz ativado. Fala "ler novidades" pra eu ler as últimas, ou o nome de outra página pra ir.');
}

function _criarReconhecimentoFeed(Api){
  _vozFeedReconhecimento = new Api();
  _vozFeedReconhecimento.lang = 'pt-BR';
  _vozFeedReconhecimento.continuous = true;
  _vozFeedReconhecimento.interimResults = false;

  _vozFeedReconhecimento.onstart = () => { _vozFeedUltimoSinal = Date.now(); };

  _vozFeedReconhecimento.onresult = (event) => {
    _vozFeedUltimoSinal = Date.now();
    const texto = event.results[event.results.length - 1][0].transcript.trim();
    document.getElementById('voz-feed-transcricao').textContent = '🗣️ "' + texto + '"';
    processarComandoVozFeed(texto);
  };

  _vozFeedReconhecimento.onend = () => {
    _vozFeedUltimoSinal = Date.now();
    if(_vozFeedAtiva){ try{ _vozFeedReconhecimento.start(); } catch(e){} }
  };

  _vozFeedReconhecimento.onerror = (event) => {
    if(event.error === 'not-allowed'){
      falarVozFeed('Preciso de permissão pro microfone.');
      pararModoVozFeed();
      return;
    }
    _vozFeedUltimoSinal = Date.now();
    if(_vozFeedAtiva){ setTimeout(() => { try{ _vozFeedReconhecimento.start(); } catch(e){} }, 300); }
  };

  try{ _vozFeedReconhecimento.start(); } catch(e){}
}

function pararModoVozFeed(){
  _vozFeedAtiva = false;
  _vozFeedFalando = false;
  clearInterval(_vozFeedVigia);
  if(_vozFeedReconhecimento){
    _vozFeedReconhecimento.onresult = null;
    _vozFeedReconhecimento.onend = null;
    _vozFeedReconhecimento.onerror = null;
    try{ _vozFeedReconhecimento.abort(); } catch(e){}
    _vozFeedReconhecimento = null;
  }
  _vozFeedSynth.cancel();
  document.getElementById('btn-modo-voz-feed').style.background = 'rgba(255,255,255,0.15)';
  document.getElementById('painel-modo-voz-feed').style.display = 'none';
}

function falarVozFeed(texto){
  document.getElementById('voz-feed-status').textContent = texto;
  _vozFeedFalando = true;
  _vozFeedSynth.cancel();
  const fala = new SpeechSynthesisUtterance(texto);
  fala.lang = 'pt-BR';
  fala.onend = () => {
    _vozFeedFalando = false;
    if(_vozFeedAtiva){ try{ _vozFeedReconhecimento.start(); } catch(e){} }
  };
  _vozFeedSynth.speak(fala);
  setTimeout(() => {
    _vozFeedFalando = false;
    if(_vozFeedAtiva && _vozFeedReconhecimento){ try{ _vozFeedReconhecimento.start(); } catch(e){} }
  }, Math.max(6000, (texto || '').length * 90));
}

function lerNovidadesEmVoz(){
  const empresas = Array.from(document.querySelectorAll('#feed-lista .empresa-feed')).slice(0, 5).map(el => el.textContent.trim());
  if(empresas.length === 0) return 'Nenhuma novidade por aqui ainda.';
  return `Últimas novidades de: ${empresas.join(', ')}.`;
}

async function processarComandoVozFeed(texto){
  const t = texto.toLowerCase().trim();

  if(typeof verificarNavegacaoUniversalPorVoz === 'function'){
    const destino = verificarNavegacaoUniversalPorVoz(t, 'feed.html');
    if(destino){
      localStorage.setItem('retomarModoVozAoCarregar', '1');
      falarVozFeed(destino.fala);
      setTimeout(() => { window.location.href = destino.url; }, 1200);
      return;
    }
  }

  if(t.includes('desativar modo voz') || t === 'desligar' || t === 'sair' || t.includes('cala boca') || t.includes('fica quieto')){
    falarVozFeed('Modo voz desativado.');
    setTimeout(pararModoVozFeed, 1200);
    return;
  }

  if(t.includes('ler novidade') || t.includes('ler tudo') || t.includes('o que tem') || t.includes('atualizar')){
    if(t.includes('atualizar')) initFeed();
    falarVozFeed(lerNovidadesEmVoz());
    return;
  }

  try{
    const respZeca = await fetch('/.netlify/functions/zeca-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensagem: texto })
    });
    const dadosZeca = await respZeca.json();
    if(respZeca.ok && dadosZeca.resposta){ falarVozFeed(dadosZeca.resposta); return; }
  } catch(eZeca){ console.warn('Zeca nao respondeu no modo voz', eZeca); }

  falarVozFeed('Não entendi. Fala "ler novidades" ou o nome de uma página, tipo "ir pra vitrine".');
}

if(localStorage.getItem('retomarModoVozAoCarregar') === '1' || (typeof modoVozPermanenteAtivo === 'function' && modoVozPermanenteAtivo())){
  localStorage.removeItem('retomarModoVozAoCarregar');
  setTimeout(() => iniciarModoVozFeed(), 1000);
}
</script>
<script src="js/comandos-navegacao-voz.js"></script>
<script src="js/modo-escuro.js"></script>
<a href="chat.html" class="btn-chat-flutuante" title="Papo">💬<span class="btn-chat-flutuante-label">Papo</span></a>
<script src="js/voz-acesso-cego.js"></script>
  <button type="button" class="btn-zeca-flutuante" title="Falar com o Zeca" onclick="toggleZeca()">✨<span class="btn-zeca-flutuante-label">Zeca</span></button>

  <div id="painel-zeca">
    <div class="zeca-cabecalho">
      <div>Zeca <small>a IA do GuiaZap</small></div>
      <div style="display:flex; gap:6px;">
        <button type="button" class="zeca-fechar" onclick="abrirListaConversasZeca()" title="Conversas salvas">☰</button>
        <a href="zeca.html" target="_blank" class="zeca-fechar" title="Abrir em nova aba" style="text-decoration:none; display:flex; align-items:center; justify-content:center;">↗</a>
        <button type="button" class="zeca-fechar" onclick="toggleZeca()">✕</button>
      </div>
    </div>
    <div id="zeca-mensagens"></div>
    <div class="zeca-rodape">
      <button type="button" id="zeca-anexo" class="zeca-mic-btn" onclick="_abrirSeletorImagemZeca()" title="Anexar imagem">📎</button>
      <button type="button" id="zeca-mic" class="zeca-mic-btn" onclick="toggleMicZeca()" title="Falar com o Zeca">🎙️</button>
      <input type="text" id="zeca-input" placeholder="Pergunta pro Zeca..." onkeydown="if(event.key==='Enter') enviarMensagemZeca()" onpaste="_zecaColarImagem(event)">
      <button type="button" id="zeca-enviar" onclick="enviarMensagemZeca()">➤</button>
    </div>
  </div>

<script src="js/zeca.js"></script>
</body>
</html>
