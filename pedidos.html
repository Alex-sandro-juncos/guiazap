<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Pedidos — GuiaZap</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css">
<style>
  .pedidos-header { background: #0f766e; padding: 24px 15px; text-align: center; color: white; }
  .pedidos-header h1 { font-size: 1.6rem; font-weight: 800; }
  .pedidos-wrap { max-width: 500px; margin: 0 auto; padding: 15px 15px 40px; }
  .voltar { display: block; margin-bottom: 14px; color: var(--verde-escuro); font-weight: 600; text-decoration: none; font-size: 0.85rem; }
  .abas-pedidos { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; }
  .abas-pedidos button {
    flex-shrink: 0; padding: 7px 14px; border-radius: 50px; border: 1px solid #ddd; background: white;
    font-size: 0.78rem; font-weight: 700; cursor: pointer; color: #666;
  }
  .abas-pedidos button.ativa { background: #0f766e; color: white; border-color: #0f766e; }
  .card-pedido {
    background: var(--cinza-card); border-radius: 12px; padding: 14px; margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  }
  .card-pedido .topo-pedido { display: flex; justify-content: space-between; align-items: center; }
  .card-pedido .status-pedido { font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 50px; }
  .status-aguardando_pagamento { background: #e0e7ff; color: #3730a3; }
  .status-aguardando_confirmacao { background: #fff3cd; color: #7c4a03; }
  .status-aceito, .status-preparando { background: #e0f2fe; color: #075985; }
  .status-pronto, .status-saiu_entrega { background: #ede9fe; color: #6b46c1; }
  .status-concluido { background: #e8f5e9; color: #1a7a3c; }
  .status-recusado, .status-cancelado { background: #fdeaea; color: #a4402f; }
  .card-pedido .itens-pedido { font-size: 0.85rem; color: #444; margin-top: 8px; line-height: 1.5; }
  .card-pedido .total-pedido { font-size: 0.9rem; font-weight: 700; color: var(--verde-escuro); margin-top: 8px; }
  .card-pedido .data-pedido { font-size: 0.72rem; color: #999; margin-top: 4px; }
  .acoes-pedido { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .acoes-pedido button {
    flex: 1; min-width: 100px; padding: 8px; border-radius: 8px; border: none; font-weight: 700; font-size: 0.78rem; cursor: pointer;
  }
  .btn-aceitar { background: var(--verde-whats); color: white; }
  .btn-recusar { background: #a4402f; color: white; }
  .btn-avancar { background: #0f766e; color: white; }
  .vazio-pedidos { text-align: center; padding: 50px 20px; color: #999; font-size: 0.85rem; }

  #cupom-impressao { display: none; }

  @media print {
    body * { visibility: hidden; }
    #cupom-impressao, #cupom-impressao * { visibility: visible; }
    #cupom-impressao {
      display: block; position: absolute; top: 0; left: 0; width: 100%;
      font-family: 'Courier New', monospace; font-size: 13px; padding: 10px;
    }
    .cupom-titulo { font-size: 16px; font-weight: 800; text-align: center; margin-bottom: 6px; }
    .cupom-linha { margin: 2px 0; }
    .cupom-item { margin: 3px 0; }
    .cupom-total { font-size: 15px; font-weight: 800; margin: 6px 0; }
    hr { border: none; border-top: 1px dashed #000; margin: 8px 0; }
  }
</style>
</head>
<body>
<header class="pedidos-header">
  <h1>📦 Meus Pedidos</h1>
</header>

<div class="pedidos-wrap">
  <a href="index.html" class="voltar">← Voltar ao GuiaZap</a>

  <button type="button" id="btn-modo-voz-pedidos" onclick="toggleModoVozPedidos()" aria-label="Ativar modo voz, gerenciar pedidos sem tocar na tela" style="background:#6b46c1; border:none; color:white; padding:10px 16px; border-radius:10px; font-size:0.85rem; font-weight:700; cursor:pointer; margin-bottom:12px; width:100%;">🎙️ Modo voz — gerenciar pedidos sem tocar</button>

  <div id="painel-modo-voz-pedidos" style="display:none; position:fixed; bottom:20px; left:16px; right:16px; max-width:420px; margin:0 auto; background:#1c1c2e; border-radius:16px; padding:16px; z-index:1600; box-shadow:0 4px 24px rgba(0,0,0,0.4);">
    <div style="display:flex; align-items:center; gap:10px;">
      <div id="voz-pedidos-indicador" style="width:14px; height:14px; border-radius:50%; background:#6b46c1; flex-shrink:0; transition:background 0.2s;"></div>
      <div style="flex:1; min-width:0;">
        <div style="color:white; font-weight:700; font-size:0.85rem;" id="voz-pedidos-status" aria-live="polite" role="status">🎙️ Modo voz ativado — pode falar</div>
        <div style="color:#aaa; font-size:0.75rem; margin-top:2px;" id="voz-pedidos-transcricao"></div>
      </div>
      <button type="button" onclick="toggleModoVozPedidos()" style="background:#a4402f; border:none; color:white; width:32px; height:32px; border-radius:50%; font-size:0.9rem; cursor:pointer; flex-shrink:0;">✕</button>
    </div>
  </div>

  <label style="display:flex; align-items:center; gap:8px; background:var(--cinza-card); padding:10px; border-radius:10px; margin-bottom:6px; font-size:0.85rem; cursor:pointer;">
    <input type="checkbox" id="chk-impressao-automatica" onchange="localStorage.setItem('impressao_automatica_pedidos', this.checked ? '1' : '0')">
    🖨️ Imprimir cupom automaticamente quando chegar pedido novo (nesse dispositivo)
  </label>
  <a href="ajuda-impressao.html" style="display:block; font-size:0.75rem; color:var(--verde-escuro); margin-bottom:12px;">❓ Quero que a impressão saia sem precisar clicar em nada — como configurar?</a>

  <select id="filtro-empresa-pedidos" onchange="renderPedidos()" style="width:100%; margin-bottom:12px; padding:9px; border:1px solid #ddd; border-radius:8px; font-size:0.85rem;">
    <option value="">Todas as minhas empresas</option>
  </select>

  <div class="abas-pedidos">
    <button type="button" class="ativa" data-status="" onclick="mudarAbaPedidos('', this)">Todos</button>
    <button type="button" data-status="aguardando_confirmacao" onclick="mudarAbaPedidos('aguardando_confirmacao', this)">🟡 Novos</button>
    <button type="button" data-status="aceito,preparando" onclick="mudarAbaPedidos('aceito,preparando', this)">👨‍🍳 Em andamento</button>
    <button type="button" data-status="pronto,saiu_entrega" onclick="mudarAbaPedidos('pronto,saiu_entrega', this)">🛵 Pronto/Entrega</button>
    <button type="button" data-status="concluido" onclick="mudarAbaPedidos('concluido', this)">✅ Concluídos</button>
  </div>

  <div id="lista-pedidos">Carregando...</div>
</div>

<div id="cupom-impressao"></div>

<script src="js/modo-escuro.js"></script>
<script src="config.js"></script>
<script>
const supabaseClientPedidos = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUserPedidos = null;
let minhasEmpresasPedidos = [];
let todosPedidos = [];
let abaStatusAtual = '';

function escapeHtmlPedidos(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

async function initPedidos(){
  const { data: { session } } = await supabaseClientPedidos.auth.getSession();
  if(!session){
    document.getElementById('lista-pedidos').innerHTML = '<div class="vazio-pedidos">🔒 Faça login na <a href="index.html">página inicial</a> pra ver seus pedidos.</div>';
    return;
  }
  currentUserPedidos = session.user;

  const { data: empresas } = await supabaseClientPedidos.from('profissionais').select('id, name').eq('user_id', currentUserPedidos.id);
  minhasEmpresasPedidos = empresas || [];

  if(minhasEmpresasPedidos.length === 0){
    document.getElementById('lista-pedidos').innerHTML = '<div class="vazio-pedidos">Você ainda não tem nenhuma empresa cadastrada.</div>';
    return;
  }

  document.getElementById('filtro-empresa-pedidos').innerHTML = '<option value="">Todas as minhas empresas</option>' +
    minhasEmpresasPedidos.map(e => `<option value="${e.id}">${escapeHtmlPedidos(e.name)}</option>`).join('');

  document.getElementById('chk-impressao-automatica').checked = localStorage.getItem('impressao_automatica_pedidos') === '1';

  await carregarPedidos();

  // Escuta pedidos novos em tempo real — quando um pedido é CONFIRMADO
  // (pago, esperando a empresa aceitar), imprime o cupom automaticamente
  // se a impressão automática estiver ligada nesse dispositivo
  const idsEmpresas = minhasEmpresasPedidos.map(e => e.id);
  supabaseClientPedidos
    .channel('pedidos-realtime')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'pedidos' }, (payload) => {
      if(idsEmpresas.includes(payload.new.profissional_id) && payload.new.status === 'aguardando_confirmacao'){
        carregarPedidos().then(() => {
          if(localStorage.getItem('impressao_automatica_pedidos') === '1'){
            imprimirCupomPedido(payload.new.id);
          }
          if(_vozPedidosAtiva){
            const itens = (payload.new.itens || []).map(i => i.nome).join(', ');
            falarVozPedidos(`Pedido novo! Total de ${Number(payload.new.total).toFixed(2).replace('.', ',')} reais. Itens: ${itens}. Fala "aceitar" ou "recusar".`);
          }
        });
      }
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pedidos' }, (payload) => {
      if(idsEmpresas.includes(payload.new.profissional_id)) carregarPedidos();
    })
    .subscribe();
}

async function carregarPedidos(){
  const idsEmpresas = minhasEmpresasPedidos.map(e => e.id);
  const { data, error } = await supabaseClientPedidos
    .from('pedidos')
    .select('*, profissionais(name, cidade)')
    .in('profissional_id', idsEmpresas)
    .order('created_at', { ascending: false });

  if(error){ console.error(error); document.getElementById('lista-pedidos').innerHTML = '<div class="vazio-pedidos">Erro ao carregar pedidos.</div>'; return; }

  todosPedidos = data || [];
  renderPedidos();
}

function mudarAbaPedidos(status, btn){
  abaStatusAtual = status;
  document.querySelectorAll('.abas-pedidos button').forEach(b => b.classList.remove('ativa'));
  btn.classList.add('ativa');
  renderPedidos();
}

function renderPedidos(){
  const empresaFiltro = document.getElementById('filtro-empresa-pedidos').value;
  const statusFiltro = abaStatusAtual ? abaStatusAtual.split(',') : null;

  let lista = todosPedidos.filter(p => {
    if(empresaFiltro && p.profissional_id !== empresaFiltro) return false;
    if(statusFiltro && !statusFiltro.includes(p.status)) return false;
    return true;
  });

  const container = document.getElementById('lista-pedidos');
  if(lista.length === 0){
    container.innerHTML = '<div class="vazio-pedidos">Nenhum pedido por aqui.</div>';
    return;
  }

  container.innerHTML = lista.map(p => {
    const itens = (p.itens || []).map(i => `${escapeHtmlPedidos(i.nome)} — R$ ${escapeHtmlPedidos(i.preco)}`).join('<br>');
    const nomeEmpresa = p.profissionais ? p.profissionais.name : '';
    const dataFormatada = new Date(p.created_at).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

    let acoes = '';
    if(p.status === 'aguardando_confirmacao'){
      acoes = `
        <button type="button" class="btn-aceitar" onclick="mudarStatusPedido('${p.id}', 'aceito')">✅ Aceitar</button>
        <button type="button" class="btn-recusar" onclick="recusarPedido('${p.id}')">❌ Recusar</button>
      `;
    } else if(p.status === 'aceito'){
      acoes = `<button type="button" class="btn-avancar" onclick="mudarStatusPedido('${p.id}', 'preparando')">👨‍🍳 Marcar como preparando</button>`;
    } else if(p.status === 'preparando'){
      acoes = `<button type="button" class="btn-avancar" onclick="mudarStatusPedido('${p.id}', 'pronto')">📦 Marcar como pronto</button>`;
    } else if(p.status === 'pronto'){
      acoes = `
        ${p.taxa_entrega > 0 ? `<button type="button" class="btn-avancar" style="background:#a4402f;" onclick="avisarTodosMotoboys('${p.id}')">📢 Avisar todos os motoboys</button>` : ''}
        <button type="button" class="btn-avancar" onclick="mudarStatusPedido('${p.id}', 'saiu_entrega')">🛵 Saiu pra entrega</button>
        <button type="button" class="btn-avancar" onclick="mudarStatusPedido('${p.id}', 'concluido')">✅ Concluir (retirada)</button>
      `;
    } else if(p.status === 'saiu_entrega'){
      acoes = `<button type="button" class="btn-avancar" onclick="mudarStatusPedido('${p.id}', 'concluido')">✅ Marcar como entregue</button>`;
    }

    return `
      <div class="card-pedido">
        <div class="topo-pedido">
          <b style="font-size:0.85rem;">${escapeHtmlPedidos(nomeEmpresa)}</b>
          <span class="status-pedido status-${p.status}">${statusTextoPedidos(p.status)}</span>
        </div>
        <div class="itens-pedido">${itens}</div>
        <div class="total-pedido">Total: R$ ${Number(p.total).toFixed(2).replace('.', ',')}</div>
        ${p.endereco_entrega ? `<div class="data-pedido">📍 ${escapeHtmlPedidos(p.endereco_entrega)}</div>` : ''}
        ${p.latitude_entrega != null && p.longitude_entrega != null ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${p.latitude_entrega},${p.longitude_entrega}" target="_blank" style="display:inline-block; font-size:0.78rem; font-weight:700; color:#1565c0; text-decoration:none;">🗺️ Ver no mapa</a>` : ''}
        ${p.forma_pagamento ? `<div class="data-pedido">💳 ${escapeHtmlPedidos(p.forma_pagamento)}</div>` : ''}
        ${p.codigo_confirmacao && !['concluido', 'recusado', 'cancelado'].includes(p.status) ? `<div style="background:#fff3cd; color:#7c4a03; font-weight:800; padding:6px 10px; border-radius:8px; margin-top:6px; font-size:0.85rem;">🔑 Código de confirmação: ${escapeHtmlPedidos(p.codigo_confirmacao)}</div>` : ''}
        <div class="data-pedido">${dataFormatada}</div>
        <div class="acoes-pedido">
          ${acoes}
          <button type="button" class="btn-avancar" style="background:#555;" onclick="imprimirCupomPedido('${p.id}')">🖨️ Imprimir</button>
        </div>
      </div>
    `;
  }).join('');
}

function statusTextoPedidos(status){
  const mapa = {
    aguardando_pagamento: '💳 Aguardando pagamento',
    aguardando_confirmacao: '🟡 Aguardando',
    aceito: '✅ Aceito',
    preparando: '👨‍🍳 Preparando',
    pronto: '📦 Pronto',
    saiu_entrega: '🛵 Em entrega',
    concluido: '✅ Concluído',
    recusado: '❌ Recusado',
    cancelado: '🚫 Cancelado'
  };
  return mapa[status] || status;
}

async function recusarPedidoNucleo(pedidoId){
  try{
    const { data: { session } } = await supabaseClientPedidos.auth.getSession();
    const resp = await fetch('/.netlify/functions/estornar-pagamento-pedido', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ pedidoId })
    });
    const data = await resp.json();
    await carregarPedidos();
    if(!resp.ok) return { ok: false, error: data.error || 'tente novamente' };
    return { ok: true, estornado: data.estornado };
  } catch(e){
    console.error(e);
    return { ok: false, error: 'erro ao recusar o pedido' };
  }
}

async function recusarPedido(pedidoId){
  const pedido = todosPedidos.find(p => p.id === pedidoId);
  if(!pedido) return;

  const jaFoiPago = pedido.status === 'aguardando_confirmacao' || pedido.status === 'aceito' || pedido.status === 'preparando' || pedido.status === 'pronto' || pedido.status === 'saiu_entrega';
  const confirmou = confirm(jaFoiPago
    ? 'Recusar esse pedido? O valor já pago será estornado automaticamente pro cliente.'
    : 'Recusar esse pedido?');
  if(!confirmou) return;

  const resultado = await recusarPedidoNucleo(pedidoId);
  if(!resultado.ok){ alert('Erro ao recusar/estornar o pedido: ' + resultado.error); return; }
  alert(resultado.estornado ? 'Pedido recusado e valor estornado ao cliente.' : 'Pedido recusado.');
}

// Versão pro modo voz — sem confirm() nem alert(), que travariam esperando
// clique. Aqui, o próprio "fala recusar" já É a confirmação da pessoa.
async function recusarPedidoPorVoz(pedidoId){
  const resultado = await recusarPedidoNucleo(pedidoId);
  return resultado;
}

async function mudarStatusPedidoNucleo(pedidoId, novoStatus){
  const pedido = todosPedidos.find(p => p.id === pedidoId);

  const { error } = await supabaseClientPedidos.from('pedidos').update({ status: novoStatus, updated_at: new Date().toISOString() }).eq('id', pedidoId);
  if(error){ console.error(error); return { ok: false, error: 'Erro ao atualizar pedido.' }; }

  // Avisa o cliente no Papo sobre a mudança de status
  if(pedido && pedido.conversa_id){
    await supabaseClientPedidos.from('mensagens_chat').insert({
      conversa_id: pedido.conversa_id,
      remetente_user_id: currentUserPedidos.id,
      tipo: 'texto',
      texto: `📦 Seu pedido foi atualizado: ${statusTextoPedidos(novoStatus)}`,
      lida: false
    });
    await supabaseClientPedidos.from('conversas').update({ ultima_mensagem_em: new Date().toISOString() }).eq('id', pedido.conversa_id);
  }

  // Se o pedido é de ENTREGA e acabou de ficar pronto, avisa os motoboys
  // dessa empresa que tem uma corrida disponível — dá prioridade pros
  // preferidos da mesma cidade da empresa; se não tiver nenhum, avisa
  // todo mundo da mesma cidade. Pra chamar gente de outra cidade, a
  // empresa usa o botão manual "Avisar todos" que aparece depois.
  if(novoStatus === 'pronto' && pedido && pedido.taxa_entrega > 0){
    await notificarMotoboysDisponiveis(pedido, false);
  }

  await carregarPedidos();
  return { ok: true };
}

async function mudarStatusPedido(pedidoId, novoStatus){
  const pedido = todosPedidos.find(p => p.id === pedidoId);

  // Antes de marcar como concluído (entregue/retirado), confere o código
  // de confirmação — garante que é realmente a pessoa certa recebendo
  if(novoStatus === 'concluido' && pedido && pedido.codigo_confirmacao){
    const digitado = prompt(`Peça pro cliente informar o código de confirmação dele, e digite aqui:`);
    if(digitado === null) return; // cancelou
    if(digitado.trim() !== pedido.codigo_confirmacao){
      alert('❌ Código incorreto! Confira com o cliente antes de confirmar a entrega.');
      return;
    }
  }

  const resultado = await mudarStatusPedidoNucleo(pedidoId, novoStatus);
  if(!resultado.ok) alert(resultado.error);
}

// Versão pro modo voz — sem prompt(). O código já vem conferido de fora
// (a pessoa falou o código, e o comparamos ANTES de chamar essa função).
async function mudarStatusPedidoPorVoz(pedidoId, novoStatus){
  return await mudarStatusPedidoNucleo(pedidoId, novoStatus);
}

async function notificarMotoboysDisponiveis(pedido, todasAsCidades){
  const { data: motoboysDaEmpresa } = await supabaseClientPedidos.from('motoboys').select('user_id, preferido, cidade').eq('profissional_id', pedido.profissional_id).eq('ativo', true);
  if(!motoboysDaEmpresa || motoboysDaEmpresa.length === 0) return;

  const cidadeEmpresa = pedido.profissionais ? pedido.profissionais.cidade : null;

  let destinatarios;
  if(todasAsCidades){
    // Botão manual "avisar todos" — ignora região e preferência, chama todo mundo
    destinatarios = motoboysDaEmpresa;
  } else {
    const daMesmaCidade = cidadeEmpresa ? motoboysDaEmpresa.filter(m => m.cidade === cidadeEmpresa) : motoboysDaEmpresa;
    const preferidosDaCidade = daMesmaCidade.filter(m => m.preferido);
    // Prioridade: preferidos da cidade > qualquer um da cidade > (se não tiver
    // ninguém cadastrado na cidade) todo mundo, pra não deixar a entrega sem aviso nenhum
    destinatarios = preferidosDaCidade.length > 0 ? preferidosDaCidade : (daMesmaCidade.length > 0 ? daMesmaCidade : motoboysDaEmpresa);
  }

  if(destinatarios.length === 0) return;

  fetch('/.netlify/functions/enviar-push', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      titulo: '🛵 Nova entrega disponível!',
      mensagem: `Corrida de R$ ${Number(pedido.taxa_entrega).toFixed(2).replace('.', ',')} esperando`,
      url: '/entregas.html',
      userIds: destinatarios.map(m => m.user_id)
    })
  }).catch(e => console.error('erro ao notificar motoboys', e));
}

async function avisarTodosMotoboys(pedidoId){
  const pedido = todosPedidos.find(p => p.id === pedidoId);
  if(!pedido) return;
  await notificarMotoboysDisponiveis(pedido, true);
  alert('📢 Aviso enviado pra todos os motoboys cadastrados, de qualquer cidade.');
}

// ---------- IMPRESSÃO DO CUPOM ----------

function imprimirCupomPedido(pedidoId){
  const p = todosPedidos.find(x => x.id === pedidoId);
  if(!p){
    alert('Pedido não encontrado pra imprimir. Tenta atualizar a página.');
    return;
  }

  const nomeEmpresa = p.profissionais ? p.profissionais.name : '';
  const dataFormatada = new Date(p.created_at).toLocaleString('pt-BR');
  const itensHtml = (p.itens || []).map(i => `<div class="cupom-item">${escapeHtmlPedidos(i.quantidade ? i.quantidade + 'x ' : '')}${escapeHtmlPedidos(i.nome)} — R$ ${escapeHtmlPedidos(i.preco)}</div>`).join('');

  document.getElementById('cupom-impressao').innerHTML = `
    <div class="cupom-titulo">${escapeHtmlPedidos(nomeEmpresa)}</div>
    <div class="cupom-linha">Pedido #${p.id.slice(0, 8).toUpperCase()}</div>
    <div class="cupom-linha">${dataFormatada}</div>
    <hr>
    ${itensHtml}
    <hr>
    ${p.taxa_entrega > 0 ? `<div class="cupom-linha">Taxa de entrega: R$ ${Number(p.taxa_entrega).toFixed(2).replace('.', ',')}</div>` : ''}
    <div class="cupom-total">TOTAL: R$ ${Number(p.total).toFixed(2).replace('.', ',')}</div>
    ${p.forma_pagamento ? `<div class="cupom-linha">Pagamento: ${escapeHtmlPedidos(p.forma_pagamento)}</div>` : ''}
    ${p.endereco_entrega ? `<hr><div class="cupom-linha"><b>ENTREGAR EM:</b></div><div class="cupom-linha">${escapeHtmlPedidos(p.endereco_entrega)}</div>` : '<hr><div class="cupom-linha"><b>RETIRADA NO LOCAL</b></div>'}
    ${p.codigo_confirmacao ? `<hr><div class="cupom-linha"><b>Código de confirmação: ${escapeHtmlPedidos(p.codigo_confirmacao)}</b></div>` : ''}
  `;

  setTimeout(() => window.print(), 100);
}

// ---------- MODO VOZ NA TELA DE PEDIDOS ----------

let _vozPedidosReconhecimento = null;
let _vozPedidosAtiva = false;
let _vozPedidosFalando = false;
const _vozPedidosSynth = window.speechSynthesis;

function toggleModoVozPedidos(){
  if(_vozPedidosAtiva) pararModoVozPedidos();
  else iniciarModoVozPedidos();
}

let _aguardandoAtivacaoPedidos = false;
let _vozPedidosUltimoSinalDeVida = 0;
let _vozPedidosVigia = null;
let _vozPedidosTentativasReconexao = 0;

function iniciarModoVozPedidos(retomandoAutomaticamente){
  const SpeechRecognitionApi = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognitionApi){
    alert('Seu navegador não suporta comando de voz. Tenta pelo Chrome no Android.');
    return;
  }

  _vozPedidosAtiva = true;
  document.getElementById('btn-modo-voz-pedidos').style.background = '#a4402f';
  document.getElementById('painel-modo-voz-pedidos').style.display = 'block';
  _aguardandoAtivacaoPedidos = !!retomandoAutomaticamente;
  _vozPedidosTentativasReconexao = 0;

  _criarReconhecimentoPedidos(SpeechRecognitionApi);
  _iniciarVigiaVozPedidos(SpeechRecognitionApi);
  if(typeof iniciarBiometriaSeConfigurada === 'function') iniciarBiometriaSeConfigurada();

  if(_aguardandoAtivacaoPedidos){
    falarVozPedidos('Modo voz em espera. Fala "ativar" pra começar.');
  } else {
    falarVozPedidos('Modo voz ativado pra gerenciar pedidos. Fala "pedidos novos" pra ouvir o que está esperando.');
  }
}

function _criarReconhecimentoPedidos(SpeechRecognitionApi){
  _vozPedidosReconhecimento = new SpeechRecognitionApi();
  _vozPedidosReconhecimento.lang = 'pt-BR';
  _vozPedidosReconhecimento.continuous = true;
  _vozPedidosReconhecimento.interimResults = false;

  _vozPedidosReconhecimento.onstart = () => {
    _vozPedidosUltimoSinalDeVida = Date.now();
    _vozPedidosTentativasReconexao = 0;
  };

  _vozPedidosReconhecimento.onresult = (event) => {
    _vozPedidosUltimoSinalDeVida = Date.now();
    if(!_vozPedidosAtiva) return;
    const transcricao = event.results[event.results.length - 1][0].transcript.trim();
    document.getElementById('voz-pedidos-transcricao').textContent = '🗣️ "' + transcricao + '"';

    if(_aguardandoAtivacaoPedidos){
      const t = normalizarTextoPedidos(transcricao);
      if(t.includes('ativar') || t.includes('guiazap')){
        _aguardandoAtivacaoPedidos = false;
        falarVozPedidos('Modo voz ativado.');
      }
      return;
    }

    processarComandoVozPedidos(transcricao);
  };

  _vozPedidosReconhecimento.onend = () => {
    _vozPedidosUltimoSinalDeVida = Date.now();
    if(_vozPedidosAtiva && !_vozPedidosFalando){
      try{ _vozPedidosReconhecimento.start(); } catch(e){}
    }
  };

  _vozPedidosReconhecimento.onerror = (event) => {
    if(event.error === 'not-allowed'){
      alert('Você precisa permitir o uso do microfone.');
      pararModoVozPedidos();
      return;
    }
    _vozPedidosUltimoSinalDeVida = Date.now();
  };

  try{ _vozPedidosReconhecimento.start(); } catch(e){}
  _vozPedidosUltimoSinalDeVida = Date.now();
}

function _iniciarVigiaVozPedidos(SpeechRecognitionApi){
  clearInterval(_vozPedidosVigia);
  _vozPedidosVigia = setInterval(() => {
    if(!_vozPedidosAtiva){ clearInterval(_vozPedidosVigia); return; }
    if(_vozPedidosFalando) return;

    const semSinalHa = Date.now() - _vozPedidosUltimoSinalDeVida;
    if(semSinalHa > 8000){
      _vozPedidosTentativasReconexao++;
      console.warn('modo voz de Pedidos parece ter travado, recriando (tentativa ' + _vozPedidosTentativasReconexao + ')');
      try{ _vozPedidosReconhecimento.onend = null; _vozPedidosReconhecimento.onerror = null; _vozPedidosReconhecimento.stop(); } catch(e){}
      _criarReconhecimentoPedidos(SpeechRecognitionApi);

      if(_vozPedidosTentativasReconexao === 2){
        falarVozPedidos('O microfone parou de responder. Reconectando...');
      }
    }
  }, 4000);
}

function pararModoVozPedidos(){
  _vozPedidosAtiva = false;
  clearInterval(_vozPedidosVigia);
  if(typeof pararBiometriaSeAtiva === 'function') pararBiometriaSeAtiva();
  if(_vozPedidosReconhecimento){
    _vozPedidosReconhecimento.onresult = null;
    _vozPedidosReconhecimento.onend = null;
    _vozPedidosReconhecimento.onerror = null;
    try{ _vozPedidosReconhecimento.abort(); } catch(e){}
    _vozPedidosReconhecimento = null;
  }
  _vozPedidosSynth.cancel();
  document.getElementById('btn-modo-voz-pedidos').style.background = '#6b46c1';
  document.getElementById('painel-modo-voz-pedidos').style.display = 'none';
}

function falarVozPedidos(texto){
  _vozPedidosFalando = true;
  if(_vozPedidosReconhecimento){ try{ _vozPedidosReconhecimento.stop(); } catch(e){} }
  _vozPedidosSynth.cancel();

  document.getElementById('voz-pedidos-status').textContent = '🔊 ' + texto;
  document.getElementById('voz-pedidos-indicador').style.background = '#4fc3a1';

  const fala = new SpeechSynthesisUtterance(texto);
  fala.lang = 'pt-BR';
  fala.rate = 1;

  fala.onend = () => {
    document.getElementById('voz-pedidos-indicador').style.background = '#6b46c1';
    document.getElementById('voz-pedidos-status').textContent = '🎙️ Pode falar';
    _vozPedidosFalando = false;
    if(_vozPedidosAtiva){ try{ _vozPedidosReconhecimento.start(); } catch(e){} }
  };

  _vozPedidosSynth.speak(fala);
  setTimeout(function(){
    _vozPedidosFalando = false;
    if(_vozPedidosReconhecimento){ try{ _vozPedidosReconhecimento.start(); } catch(e){} }
  }, 6000);
}

function lerPedidosNovosEmVoz(){
  const pendentes = todosPedidos.filter(p => p.status === 'aguardando_confirmacao');
  if(pendentes.length === 0) return falarVozPedidos('Nenhum pedido novo esperando confirmação.');

  if(pendentes.length === 1){
    const p = pendentes[0];
    const itens = (p.itens || []).map(i => i.nome).join(', ');
    falarVozPedidos(`1 pedido esperando: ${itens}. Total de ${Number(p.total).toFixed(2).replace('.', ',')} reais. Fala "aceitar" ou "recusar".`);
    return;
  }

  const resumo = pendentes.map((p, i) => `Pedido ${i + 1}: R$ ${Number(p.total).toFixed(2).replace('.', ',')}`).join('. ');
  falarVozPedidos(`${pendentes.length} pedidos esperando. ${resumo}. Fala "aceitar pedido 1", por exemplo.`);
}

async function processarComandoVozPedidos(transcricao){
  if(_vozPedidosSynth) try{ _vozPedidosSynth.cancel(); } catch(e){}
  _vozPedidosFalando = false;

  const _textoBiometriaPd = normalizarTextoPedidos(transcricao);
  const _ehPararPd = _textoBiometriaPd.includes('parar') || _textoBiometriaPd.includes('desativar modo voz') || _textoBiometriaPd.includes('cala boca') || _textoBiometriaPd.includes('fica quieto') || _textoBiometriaPd.includes('fique quieto');
  if(!_ehPararPd && typeof comandoDeVozAutorizado === 'function' && !comandoDeVozAutorizado()){
    return;
  }

  // Prioridade máxima: se estamos esperando o código de confirmação de
  // entrega, essa fala é o código — nada mais é processado
  if(_aguardandoCodigoConfirmacaoVoz){
    await processarCodigoConfirmacaoVoz(transcricao);
    return;
  }

  const textoNorm = normalizarTextoPedidos(transcricao);

  // Comandos locais instantâneos
  if(textoNorm.includes('ir para vitrine') || textoNorm.includes('ver produtos') || textoNorm.includes('ir pra vitrine')){
    localStorage.setItem('retomarModoVozAoCarregar', '1');
    falarVozPedidos('Indo pra Vitrine...');
    setTimeout(() => { window.location.href = 'vitrine.html'; }, 1200);
    return;
  }

  if(textoNorm.includes('ir para pagina inicial') || textoNorm.includes('voltar pro guiazap') || textoNorm.includes('ir pro guiazap')){
    localStorage.setItem('retomarModoVozAoCarregar', '1');
    falarVozPedidos('Voltando pra página inicial...');
    setTimeout(() => { window.location.href = 'index.html'; }, 1200);
    return;
  }

  if(textoNorm.includes('pedidos novos') || textoNorm.includes('pedido novo') || textoNorm.includes('o que tem')){
    lerPedidosNovosEmVoz();
    return;
  }
  if(textoNorm.includes('parar') || textoNorm.includes('desativar modo voz') || textoNorm.includes('cala boca') || textoNorm.includes('fica quieto') || textoNorm.includes('fique quieto')){
    falarVozPedidos('Modo voz desativado.');
    setTimeout(pararModoVozPedidos, 1500);
    return;
  }

  // Atalho rápido: se só tem 1 pedido pendente e a pessoa disse só "aceitar"/"recusar" (sem número), age direto
  const pendentes = todosPedidos.filter(p => p.status === 'aguardando_confirmacao');
  if(pendentes.length === 1){
    if((textoNorm.includes('aceitar') || textoNorm === 'aceita') && !textoNorm.match(/\d/)){
      falarVozPedidos('Aceitando o pedido...');
      await mudarStatusPedido(pendentes[0].id, 'aceito');
      falarVozPedidos('Pedido aceito!');
      return;
    }
    if((textoNorm.includes('recusar') || textoNorm === 'recusa') && !textoNorm.match(/\d/)){
      falarVozPedidos('Recusando o pedido, o pagamento vai ser estornado...');
      const resultado = await recusarPedidoPorVoz(pendentes[0].id);
      falarVozPedidos(resultado.ok ? 'Pedido recusado e estornado.' : `Erro: ${resultado.error}`);
      return;
    }
  }

  // Comando mais complexo — manda pro Claude interpretar
  document.getElementById('voz-pedidos-status').textContent = '🤔 Pensando...';
  document.getElementById('voz-pedidos-indicador').style.background = '#e91e63';

  try{
    const { data: { session } } = await supabaseClientPedidos.auth.getSession();
    const pedidosVisiveis = todosPedidos.filter(p => !['concluido', 'recusado', 'cancelado'].includes(p.status)).map(p => ({
      id: p.id, status: p.status, total: p.total, itensResumo: (p.itens || []).map(i => i.nome).join(', ')
    }));

    const resp = await fetch('/.netlify/functions/interpretar-comando-voz-pedidos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ texto: transcricao, pedidosVisiveis })
    });
    const resultado = await resp.json();

    if(!resp.ok){
      falarVozPedidos(resultado.error || 'Tive um problema ao entender. Pode repetir?');
      return;
    }

    await executarAcaoVozPedidos(resultado);
  } catch(e){
    console.error(e);
    falarVozPedidos('Não consegui processar agora. Pode repetir?');
  }
}

async function executarAcaoVozPedidos(resultado){
  const { action, params, voice_response } = resultado;

  if(action === 'LER_PEDIDOS_NOVOS'){
    lerPedidosNovosEmVoz();
    return;
  }

  if(action === 'ACEITAR' && params && params.id){
    await mudarStatusPedido(params.id, 'aceito');
    falarVozPedidos(voice_response || 'Pedido aceito!');
    return;
  }

  if(action === 'RECUSAR' && params && params.id){
    const resultado = await recusarPedidoPorVoz(params.id);
    falarVozPedidos(resultado.ok ? (voice_response || 'Pedido recusado e estornado.') : `Erro ao recusar: ${resultado.error}`);
    return;
  }

  if(action === 'AVANCAR_STATUS' && params && params.id){
    const pedido = todosPedidos.find(p => p.id === params.id);
    if(pedido){
      // "pronto" pode ir pra "saiu_entrega" (se faz entrega) OU direto pra
      // "concluido" (se é retirada no local, sem entrega)
      const proximoStatus = {
        aceito: 'preparando',
        preparando: 'pronto',
        pronto: pedido.taxa_entrega > 0 ? 'saiu_entrega' : 'concluido',
        saiu_entrega: 'concluido'
      }[pedido.status];

      if(proximoStatus === 'concluido' && pedido.codigo_confirmacao){
        // Não conclui direto — pede o código de confirmação por voz primeiro
        _aguardandoCodigoConfirmacaoVoz = { pedidoId: params.id, codigoEsperado: pedido.codigo_confirmacao };
        falarVozPedidos('Pede pro cliente falar o código de confirmação dele, e repete os números pra mim.');
        return;
      }

      if(proximoStatus){
        await mudarStatusPedidoPorVoz(params.id, proximoStatus);
        falarVozPedidos(voice_response || 'Status atualizado!');
        return;
      }
    }
  }

  falarVozPedidos(voice_response || 'Feito.');
}

let _aguardandoCodigoConfirmacaoVoz = null;

async function processarCodigoConfirmacaoVoz(transcricao){
  const digitosFalados = extrairDigitosDaFalaPedidos(transcricao);
  const dados = _aguardandoCodigoConfirmacaoVoz;

  if(!digitosFalados){
    falarVozPedidos('Não entendi os números. Fala de novo, um por um.');
    return;
  }

  if(digitosFalados !== dados.codigoEsperado){
    falarVozPedidos('Código incorreto. Confere com o cliente e fala de novo — ou fala "cancelar" pra desistir.');
    if(normalizarTextoPedidos(transcricao).includes('cancelar')){
      _aguardandoCodigoConfirmacaoVoz = null;
      falarVozPedidos('Cancelado.');
    }
    return;
  }

  const pedidoId = dados.pedidoId;
  _aguardandoCodigoConfirmacaoVoz = null;
  await mudarStatusPedidoPorVoz(pedidoId, 'concluido');
  falarVozPedidos('Código certo! Pedido concluído.');
}

function extrairDigitosDaFalaPedidos(texto){
  const mapaNumeros = { zero:'0', um:'1', uma:'1', dois:'2', duas:'2', tres:'3', três:'3', quatro:'4', cinco:'5', seis:'6', sete:'7', oito:'8', nove:'9' };
  const normalizado = normalizarTextoPedidos(texto);
  const palavras = normalizado.split(/\s+/);
  let digitos = '';
  palavras.forEach(palavra => {
    if(/^\d+$/.test(palavra)) digitos += palavra;
    else if(mapaNumeros[palavra] !== undefined) digitos += mapaNumeros[palavra];
  });
  return digitos;
}

function normalizarTextoPedidos(str){
  return (str || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

initPedidos();

if(localStorage.getItem('retomarModoVozAoCarregar') === '1'){
  localStorage.removeItem('retomarModoVozAoCarregar');
  setTimeout(() => iniciarModoVozPedidos(true), 800);
}
