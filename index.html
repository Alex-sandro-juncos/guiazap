<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GuiaZap — Encontre profissionais e fale direto no WhatsApp</title>
<meta name="description" content="Encontre empresas e profissionais perto de você e fale direto no WhatsApp. Busque por categoria, cidade e bairro no GuiaZap.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2325D366'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='Arial, sans-serif' font-weight='bold'%3EG%3C/text%3E%3C/svg%3E">

<meta property="og:title" content="GuiaZap — Encontre profissionais e fale direto no WhatsApp">
<meta property="og:description" content="Encontre empresas e profissionais perto de você e fale direto no WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://guiazap.shop">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="logo">GuiaZap</div>
  <p>Encontre qualquer profissional e fale direto no WhatsApp</p>
</header>

<div class="wrap">
  <div id="config-warning" class="config-warning" style="display:none;">
    ⚠ Configuração pendente — preencha SUPABASE_URL e SUPABASE_ANON_KEY no arquivo config.js. Veja o README.md.
  </div>

  <div id="auth-logged-out" class="auth-box">
    <div class="auth-row">
      <input id="auth-email" type="email" placeholder="Seu e-mail" autocomplete="off">
      <input id="auth-password" type="password" placeholder="Senha" autocomplete="off">
    </div>
    <div class="auth-actions">
      <button type="button" class="btn-auth" onclick="signIn()">Entrar</button>
      <button type="button" class="btn-auth-outline" onclick="signUp()">Criar conta</button>
      <span class="auth-msg" id="auth-msg"></span>
    </div>
    <a href="#" class="forgot-link" onclick="forgotPassword(); return false;">Esqueci minha senha</a>
  </div>

  <div id="auth-logged-in" class="auth-box-logged" style="display:none;">
    <span>Logado como <b id="auth-email-display"></b></span>
    <button type="button" class="btn-auth-outline" onclick="signOut()">Sair</button>
  </div>

  <div class="busca-container">
    <div class="busca-row">
      <input id="search" placeholder="O que você procura? Ex: Dentista, Barbeiro..." oninput="render()">
    </div>
    <div class="field" style="margin-bottom:10px;">
      <input id="filter-cep" placeholder="Buscar por CEP (opcional)" onblur="buscarCepFiltro()">
      <span class="cep-msg" id="filter-cep-msg"></span>
    </div>
    <div class="filtros">
      <select id="filter-estado" onchange="onEstadoFiltroChange()"><option value="">Estado</option></select>
      <input id="filter-cidade" list="cidades-filtro-list" placeholder="Cidade" oninput="render()" onchange="onCidadeFiltroChange()">
      <datalist id="cidades-filtro-list"></datalist>
      <select id="filter-bairro" onchange="render()"><option value="">Bairro</option></select>
    </div>
  </div>

  <button class="btn-cadastro" id="add-btn" onclick="openForm()">+ Cadastrar minha empresa - R$5/mês</button>

  <form id="cadastro-form" onsubmit="return saveEntry(event)">
    <input type="hidden" id="edit-id">
    <div class="field">
      <label>Nome</label>
      <input id="f-name" required placeholder="Ex: Ana Silva / Padaria Bom Pão">
    </div>
    <div class="field">
      <label>CNPJ ou CPF</label>
      <input id="f-documento" required placeholder="Só números">
    </div>
    <div class="field">
      <label>Categoria principal</label>
      <input id="f-cat" required placeholder="Ex: Dentista">
    </div>
    <div class="field">
      <label>Outras categorias (opcional)</label>
      <div id="categorias-extra-list"></div>
      <button type="button" class="btn-add-contato" onclick="adicionarLinhaCategoria()">+ Adicionar outra categoria</button>
    </div>
    <div class="field">
      <label>CEP</label>
      <input id="f-cep" placeholder="Ex: 01310-100" onblur="buscarCep()">
      <span class="cep-msg" id="cep-msg"></span>
    </div>
    <div class="row2">
      <div class="field">
        <label>Estado</label>
        <select id="f-estado" required onchange="onEstadoCadastroChange()"><option value="">Selecione</option></select>
      </div>
      <div class="field">
        <label>Cidade</label>
        <input id="f-cidade" required list="cidades-cadastro-list" placeholder="Digite ou selecione">
        <datalist id="cidades-cadastro-list"></datalist>
      </div>
      <div class="field">
        <label>Bairro</label>
        <input id="f-bairro" required placeholder="Ex: Vila Mariana">
      </div>
    </div>
    <div class="field">
      <label>WhatsApp (com DDD, só números)</label>
      <input id="f-whatsapp" required placeholder="Ex: 11912345678">
    </div>
    <div class="field">
      <label>Outros contatos (opcional)</label>
      <div id="contatos-extra-list"></div>
      <button type="button" class="btn-add-contato" onclick="adicionarLinhaContato()">+ Adicionar outro contato</button>
    </div>
    <div class="field">
      <label>Foto (opcional)</label>
      <div class="foto-botoes">
        <label class="btn-foto-opcao">
          📷 Tirar foto
          <input type="file" accept="image/*" capture="environment" onchange="enviarFoto(event)" style="display:none;">
        </label>
        <label class="btn-foto-opcao">
          🖼️ Escolher da galeria
          <input type="file" accept="image/*" onchange="enviarFoto(event)" style="display:none;">
        </label>
      </div>
      <span class="foto-msg" id="foto-msg"></span>
      <img id="foto-preview" class="foto-preview" style="display:none;">
      <label class="foto-ou">ou cole um link de foto já existente</label>
      <input id="f-foto" placeholder="https://..." oninput="onFotoLinkChange()">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-salvar">Salvar</button>
      <button type="button" class="btn-cancelar" onclick="closeForm()">Cancelar</button>
      <span class="form-msg" id="form-msg"></span>
    </div>
  </form>

  <div class="result-header" id="count"></div>
  <div id="list"></div>
  <div class="loading" id="loading">carregando profissionais...</div>
</div>

<script src="config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
